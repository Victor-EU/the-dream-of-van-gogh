    // the station authors, in the same words as tools/room.py -- the same
    // arrangement the shell's depth points have, and for the same reason: what
    // a person typed belongs in the file a person reads, so that arguing with
    // it costs a reload and not a rebuild.
    const eyeM = sn.eye ?? 1.65;
    // How much of this canvas's paint is laid at all, driven by the walk. One
    // everywhere except at station 5, where three canvases share a room and
    // `at` says how far into it each of them is the room.
    const presence = { value: 1 };
    const room = (() => {
      if (mode !== 'built') return null;
      const b = spec.back ?? blob.room?.back;
      if (!b || !(b[3] - vhorizon > 1e-4)) return null;
      const [ul, ur, vc, vf] = b, k = eyeM / (vf - vhorizon);
      return { left: k * (axisU - ul) * aspect, right: k * (ur - axisU) * aspect,
               ceil: eyeM + k * (vhorizon - vc), depth: k * fz };
    })();
    // A hung canvas: the paint is 3.6 m tall whatever it is a picture of, and
    // it stands on the ground rather than through it.
    // A hung canvas is 3.6 m tall whatever it is a picture of. A canvas laid on
    // the ground is 1:1, because the thing it is a picture of is at your feet
    // and is the size he painted it.
    const scale = Q.has('scale') ? num('scale', 1)
                : spec.scale ?? (mode === 'ground' ? 1 : 3.6 / tileM[1]);
    const hang = flatMode || mode === 'ground' || mode === 'built' ? 0
               : num('hang', tileM[1] * scale * 0.5 + 0.12);

    const uni = {
      uCoordLo: { value: blob.coordLo }, uCoordSpan: { value: blob.coordHi - blob.coordLo },
      uCanvasM: { value: new THREE.Vector2(...canvasM) },
      uTileCentre: { value: new THREE.Vector2(...tileCentre) },
      uShortM: { value: shortM }, uWidthK: { value: blob.widthK },
      uHeightM: { value: blob.heightMm / 1000 * num('h', 1) },
      uOrderLift: { value: (blob.orderLiftMm || 0) / 1000 * num('lift', 1) },
      uScale: { value: scale }, uHang: { value: hang },
      uScrub: { value: 1 }, uArrive: { value: num('arrive', 0.012) },
      uXray: { value: has('xray') ? 1 : 0 },
      uActHi: { value: new Float32Array(8) }, uActN: { value: 0 },
      uActBase: { value: 0 }, uActTotal: { value: 1 },
      uLight: { value: new THREE.Vector3(-0.52, 0.58, 0.34).normalize() },
      uEye: { value: eyeVec },
      uFlat: { value: flatMode ? 1 : 0 },
      uHeights: { value: has('heights') ? 1 : 0 },
      uAmbient: { value: 0.30 },
      uFurrow: { value: num('furrow', 0.16) },
      uFurrowMm: { value: num('hair', 0.55) / 1000 * scale },
      uGhost: { value: num('ghost', 0.25) }, uDim: sn._dim,
      uLift: { value: ray ? 1 : 0 },
      uSkyOnly: { value: mode === 'sky' ? 1 : 0 },
      uShell: { value: mode === 'shell' ? 1 : 0 },
      uBuilt: { value: mode === 'built' ? 1 : 0 },
      uAxisU: { value: axisU },
      uRoom: { value: new THREE.Vector4(room?.left ?? 0, room?.right ?? 0,
                                        room?.ceil ?? 0, room?.depth ?? 0) },
      // how much of this canvas's paint is laid at all. One on every canvas
      // that is alone in its space; on the three Bedrooms it is the walk.
      uPresence: presence,
      uPitch: { value: pitch },
      // The one motion. The amplitude is per stroke and measured; the gain is
      // the station's fraction of it and the rate is the station's, and that
      // one is invention -- there is no time in a painting.
      uCurlK: { value: blob.curlK || 0 },
      uCurlGain: { value: num('curl', sn.curl?.gain ?? 0) },
      uCurlRate: { value: sn.curl?.rate ?? 0.5 },
      uTime: TIME,
      uHorizon: { value: vhorizon }, uGamma: { value: num('gamma', blob.gamma) },
      uFz: { value: fz }, uAspect: { value: aspect },
      // Where the sky is, and the distance the ground is capped at. It is a
      // staging number rather than a measurement -- the plain really does run
      // to the horizon -- so the station sets it and the blob's own value is
      // only the one tools/place.py measured the thinning against. Bigger is
      // better and nearly free: the strip of canvas that gets squeezed onto the
      // cap goes as 1/dome, and at 90 m that strip was two and a half percent
      // of the canvas standing up as a wall at the horizon.
      uEyeH: { value: sn.eye ?? 1.65 },
      uDome: { value: num('dome', sn.ground?.dome ?? blob.dome ?? 90) },
      uSwell: { value: sn._SW }, uSwellC: { value: new THREE.Vector2(0, 0) },
      uYaw: { value: (spec.yaw || 0) * Math.PI / 180 },
    };
    const mat = new THREE.ShaderMaterial({
      vertexShader: STROKE_VERT, fragmentShader: STROKE_FRAG,
      uniforms: uni, side: THREE.DoubleSide });

    // canvas to world, in JS, in the same words as the vertex shader. Kept next
    // to it on purpose: a chunk's box has to land where its strokes do, and if
    // one changes and the other does not, chunks cull against the wrong box and
    // strokes vanish at the edge of the screen for no visible reason.
    const eyeH = uni.uEyeH.value, dome = uni.uDome.value;
    const cy_ = Math.cos(uni.uYaw.value), sy_ = Math.sin(uni.uYaw.value);
    const terrainLocal = (x, z) =>
      swellAt(sn._SW, cy_ * x + sy_ * z, -sy_ * x + cy_ * z);
    const lift = (cx, cy, out) => {
      const vh = vhorizon, g = uni.uGamma.value;
      let x = (cx - axisU) * aspect, y = vh - cy, z = -fz;
      if (pitch) {
        const cp = Math.cos(pitch), sp = Math.sin(pitch);
        const ny = cp * y - sp * z; z = sp * y + cp * z; y = ny;
      }
      let t;
      if (mode === 'built' && room) {
        t = room.depth / Math.max(-z, 1e-6);
        if (y < -1e-6) t = Math.min(t, eyeH / -y);
        else if (y > 1e-6) t = Math.min(t, Math.max(room.ceil - eyeH, 0.05) / y);
        if (x < -1e-6) t = Math.min(t, room.left / -x);
        else if (x > 1e-6) t = Math.min(t, room.right / x);
      }
      else if (mode === 'shell') { t = Math.max(depthAt(cx, cy), 0.05) / Math.hypot(x, y, z); }
      else if (y >= 0 || mode === 'sky') { t = dome / Math.hypot(x, y, z); }
      else {
        const rho = Math.hypot(x, z);
        const d0 = Math.min(eyeH * rho / (1 - vh)
                            * Math.pow((1 - vh) / Math.max(-y, 1e-6), g), dome);
        let d = d0;
        for (let i = 0; i < 2; i++)
          d = d0 * (eyeH - terrainLocal(x * (d / rho), z * (d / rho))) / eyeH;
        t = d / rho;
      }
      return out.set(x * t, eyeH + y * t, z * t);
    };
    const wall = (cx, cy, out) => out.set(
      (cx - tileCentre[0]) * canvasM[0] * scale,
      -(cy - tileCentre[1]) * canvasM[1] * scale + hang, 0);
    const place = lifted ? lift : wall;

    const group = new THREE.Group();
    group.rotation.y = (spec.yaw || 0) * Math.PI / 180;
    // How far a canvas stands from the standpoint. Zero for everything that is
    // a place, because a place *is* the standpoint's own rays and putting it
    // anywhere else would be putting it where it is not. A canvas that is not a
    // place has no rays to be on, so it is a wall, and a wall has to be some
    // distance away -- the Sunflowers at station 5 stand a metre and a half
    // behind where he stood, facing back at it.
    // and how far *along* the station it stands, which only a corridor needs.
    // Station 2 hangs six canvases down a hallway rather than around a
    // standpoint, because DESIGN 7 asks for that in those words: he painted
    // twenty-five self-portraits in two years because he could not afford
    // models, and you watch him learn colour down the length of it. dist puts
    // a wall out to the side, `along` puts it further down the corridor, and
    // forward is negative z everywhere in this file.
    {
      // and how far away, when the station does not say. Zero for anything on
      // rays, because a place *is* the standpoint. For a wall, the honest
      // default is where the painter stood: hfov already declares how wide the
      // canvas is taken to be from there, so the distance that makes it that
      // wide is the same number read the other way round, and it follows the
      // canvas rather than being typed. Station 5's Sunflowers were typed at
      // 1.6 m and this rule gives 2.0, which is why it is a default and not a
      // law.
      const dd = spec.dist ?? (ray ? 0 : fz * canvasM[1] * scale);
      const yw = (spec.yaw || 0) * Math.PI / 180;
      group.position.set(sn._origin.x - dd * Math.sin(yw), 0,
                         sn._origin.y - dd * Math.cos(yw) - (spec.along || 0));
    }
    // a canvas laid on the ground rather than hung on the air: DESIGN 7's
    // Irises as the literal ground at your feet, at the size he painted them.
    // It is the wall treatment with the wall tipped flat, which is all "the
    // ground at your feet" has ever meant, and the group carries the tip so no
    // shader knows about it.
    if (mode === 'ground') {
      group.rotation.x = -Math.PI / 2;
      group.position.y = 0.004;
    }
    scene.add(group);

    const bufs = strokeBuffers(blob);
    const chunkList = readChunks(blob);
    const actList = readActs(blob);
    for (let i = 0; i < actList.length - 1; i++) uni.uActHi.value[i] = actList[i].hi;
    uni.uActN.value = actList.length;
    const BASES = { near: [TIERS[tier].seg, TIERS[tier].col], mid: [2, 3] };
    const sphere = new THREE.Sphere(new THREE.Vector3(0, hang, 0),
                                    room ? Math.hypot(room.left + room.right,
                                                      room.ceil, room.depth)
                                    : lifted ? dome * 1.2
                                    : Math.max(...tileM) * scale);
    const orders = new Float32Array(blob.count);
    {
      const dv = new DataView(blob.bytes);
      for (let i = 0; i < blob.count; i++)
        orders[i] = dv.getUint16(blob.hdr + i * STRIDE + 20, true) / 65535;
    }
    const p3 = new THREE.Vector3();
    for (const c of chunkList) {
      c.mesh = {};
      for (const k of ['near', 'mid']) {
        const g = bindStrokes(ribbonBase(...BASES[k]), bufs, c.first);
        g.instanceCount = 0;
        g.boundingSphere = sphere;
        const m = new THREE.Mesh(g, mat);
        m.frustumCulled = false;
        m.visible = false;
        c.mesh[k] = m;
        if (!has('noStrokes')) group.add(m);
      }
      // A lifted chunk is a curved patch, not a rectangle: near the horizon its
      // far edge runs to the dome. So the box is sampled over the chunk rather
      // than taken from its corners, and then let out by the widest stroke in
      // it at the magnification where that stroke sits.
      c.aabb = new THREE.Box3();
      const N = lifted ? 5 : 2;
      for (let i = 0; i < N; i++)
        for (let j = 0; j < N; j++) {
          const u = c.box[0] + (c.box[2] - c.box[0]) * i / (N - 1);
          const v = c.box[1] + (c.box[3] - c.box[1]) * j / (N - 1);
          c.aabb.expandByPoint(place(u, v, p3));
        }
      const pad = lifted
        ? c.wmax * blob.widthK * dome * 0.5
        : Math.max(0.002 * scale, blob.heightMm / 1000 * scale);
      c.aabb.expandByScalar(pad);
      c.centre = c.aabb.getCenter(new THREE.Vector3());
    }

    // The underlayer, laid into the world as the canvas itself: what the
    // extractor could see of the ground between the marks, on the same rays the
    // strokes are on, one part in a thousand further off so it cannot fight
    // them for the depth buffer. Without it the gaps between the strokes show
    // the primed cloth of station 0 rather than the tone he painted onto.
    const clothUni = Object.assign({}, floorUni, {
      uFloor: { value: 0 }, uPrimed: { value: 0 }, uDisplace: { value: 0 },
      uWeaveFlat: { value: 0 },
      uWeaveM: { value: sn._weaveMm / 1000 * (ray ? 1 : scale) },
      uWeaveRough: { value: sn._rough }, uDim: sn._dim,
      uBeyond: { value: mode === 'built' ? 1 : 0 },
      uHasUnder: { value: 0 }, uUnder: { value: null },
      uSwell: { value: sn._SW }, uSwellC: { value: new THREE.Vector2(0, 0) },
      uTileUV: { value: new THREE.Vector4(tx / blob.canvasPx[0], ty / blob.canvasPx[1],
                                          tw / blob.canvasPx[0], th / blob.canvasPx[1]) },
    });
    // DoubleSide because a sheet laid onto a curved ground can fold, and a
    // folded single-sided sheet is a hole in the world rather than a crease.
    const clothMat = new THREE.ShaderMaterial({
      vertexShader: CLOTH_VERT, fragmentShader: CLOTH_FRAG, uniforms: clothUni,
      side: THREE.DoubleSide, extensions: { derivatives: true } });
    const cloths = [];
    if (mode === 'lifted') {
      // Two sheets, split exactly at the horizon, and that split is the whole
      // point. One grid across the whole canvas has a row of quads straddling
      // the horizon, and each of those quads has its top corners on the dome
      // ninety metres up and its bottom corners on the ground forty metres out.
      // What that looks like is a black sheet standing across the middle
      // distance, and it took a ?noStrokes frame to see it for what it was.
      // The ground's rows are spaced geometrically in distance rather than
      // evenly down the canvas, and that is not a nicety. A flat ground is
      // exact under any tessellation -- a planar quad with four right corners
      // is the plane -- so the only thing a row schedule has to do is follow
      // the swell, and the swell is a near thing. Evenly down the canvas, the
      // rows out at forty metres are ten metres apart and their chords cut
      // twenty centimetres under a swell the floor is following at four, and
      // that difference is the floor coming up through the painting.
      //
      // The first row is the horizon itself and not the first geometric step.
      // Everything past the dome is capped to the dome, so the strip of canvas
      // between the horizon and that cap stands up as a wall out there -- and
      // without a row on the horizon the wall is simply missing, which reads as
      // a hairline of void ruled across the picture exactly where the land
      // meets the sky.
      const M = 48, vh = vhorizon;
      const dNear = eyeH * fz / (1 - vh), R = Math.pow(dome / dNear, 1 / (M - 1));
      const rows = { sky: [], ground: [vh] };
      for (let k = 0; k <= M; k++) rows.sky.push(vh * k / M);
      for (let k = 1; k <= M; k++) rows.ground.push(vh + (1 - vh) * Math.pow(R, k - M));
      for (const which of ['sky', 'ground']) {
        const vs = rows[which];
        const g = new THREE.PlaneGeometry(1, 1, M, M);
        const pos = g.attributes.position, uv = g.attributes.uv;
        for (let i = 0; i < pos.count; i++) {
          const u = uv.getX(i);
          const v = vs[Math.round((1 - uv.getY(i)) * M)];
          uv.setXY(i, u, 1 - v);
          // exactly on the surface: the strokes stand above it by their own
          // relief, which is millimetres at the near edge and centimetres at
          // the far one -- always more than the depth buffer can confuse there.
          lift(u, v, p3);
          pos.setXYZ(i, p3.x, p3.y, p3.z);
        }
        g.computeVertexNormals();
        const m = new THREE.Mesh(g, clothMat);
        m.frustumCulled = false;
        cloths.push(m);
      }
    } else if (ray) {
      // A sky and a shell are both one continuous sheet -- neither of them has
      // a horizon running through it where one surface becomes another -- so
      // one grid over the whole canvas is right, and the split that the lifted
      // treatment needs would be a seam here.
      //
      // A room is the exception: it creases, and a one-point room creases in
      // exactly four places, which are the four edges of its own back wall. So
      // the grid gets a line laid on each of them and every quad then lies flat
      // on one wall. Without that the cloth chamfers each corner of the room by
      // half a grid cell and the paint stands off the chamfer, which reads as
      // the walls not quite meeting.
      const M = 40;
      // A room's cloth runs past the edge of the painting, and by a long way:
      // he cropped the ceiling and the near floor out of the Bedroom, and a
      // room you cannot see the ceiling of is not one you are standing in.
      // Past the painting there is nothing to show and nothing is invented --
      // the fragment shader takes it back to bare primed canvas, which is
      // station 0 and is what is under every canvas in the piece.
      const LO = room ? [-0.9, -1.2] : [0, 0], HI = room ? [1.9, 1.8] : [1, 1];
      const seam = (keys, lo, hi) => {
        const k = [lo, ...keys.filter(t => t > lo + 1e-4 && t < hi - 1e-4)
                              .sort((a, b) => a - b), hi];
        const out = [];
        for (let i = 0; i < k.length - 1; i++) {
          const n = Math.max(1, Math.round((k[i + 1] - k[i]) * M));
          for (let j = 0; j < n; j++) out.push(k[i] + (k[i + 1] - k[i]) * j / n);
        }
        return out.concat([hi]);
      };
      const bk = room ? (spec.back ?? blob.room?.back) : null;
      const us = seam(bk ? [bk[0], bk[1]] : [], LO[0], HI[0]);
      const vs = seam(bk ? [bk[2], bk[3]] : [], LO[1], HI[1]);
      const NU = us.length - 1, NV = vs.length - 1;
      const g = new THREE.PlaneGeometry(1, 1, NU, NV);
      const pos = g.attributes.position, uv = g.attributes.uv;
      for (let i = 0; i < pos.count; i++) {
        const u = us[Math.round(uv.getX(i) * NU)];
        const v = vs[Math.round((1 - uv.getY(i)) * NV)];
        uv.setXY(i, u, 1 - v);
        lift(u, v, p3);
        pos.setXYZ(i, p3.x, p3.y, p3.z);
      }
      g.computeVertexNormals();
      const m = new THREE.Mesh(g, clothMat);
      m.frustumCulled = false;
      cloths.push(m);
    } else {
      const m = new THREE.Mesh(
        new THREE.PlaneGeometry(tileM[0] * scale, tileM[1] * scale), clothMat);
      m.position.set(0, hang, -0.00006 * scale);
      cloths.push(m);
    }
    // Three canvases of one room need one substrate, not three. The cloth is
    // the plaster and the boards *under* the paint and the room has one of
    // each; three of them would z-fight along every wall, and the strokes
    // dissolving over a single shared shell is also a standing check on the
    // measurement -- if the three rooms did not agree, the shared cloth would
    // show through the two that did not fit it.
    if (spec.cloth === false) cloths.length = 0;
    for (const m of cloths) group.add(m);
    if (cloths.length) texLoader.load(spec.blob.replace(/\.bin$/, '-under.png'), tex => {
      tex.colorSpace = THREE.NoColorSpace;      // the shader decodes sRGB
      // flipY off, so v runs the way the image does and the tile sub-rect is in
      // the same coordinates the packer wrote. Left on, three.js flips the
      // upload and the shader's own flip puts the sky under the wheat.
      tex.flipY = false;
      tex.minFilter = THREE.LinearMipmapLinearFilter;
      tex.magFilter = THREE.LinearFilter;
      tex.generateMipmaps = true;
      tex.wrapS = tex.wrapT = THREE.ClampToEdgeWrapping;
      clothUni.uUnder.value = tex;
      clothUni.uHasUnder.value = 1;
      state.under = `${tex.image.width}x${tex.image.height}`;
    }, undefined, () => { state.under = 'missing'; });

    return { spec, blob, uni, mat, group, chunkList, actList, orders, cloths,
             clothUni, lifted, mode, measured, sn, scale, hang, tileM, aspect, place,
             room, presence, at: spec.at,
             lo: 0, hi: 1, shownNear: 0, shownMid: 0, drawn: 0 };
  }

  // -------------------------------------------------------- the streaming --
  // The spans are known before anything is fetched, because the station records
  // each canvas's stroke count and the runtime checks it against the blob that
  // arrives. That is what makes the scrub a prefetch signal rather than a
  // report: at any tau the piece knows which canvas is being painted next and
  // fetches that one, and the station's timing does not shift under the viewer
  // as the blobs land.
  // Every canvas of every station, in the order he painted them, under one tau
  // axis. DESIGN 5.1 asks for tau to map to the ten years non-linearly, and
  // what makes it non-linear is the record rather than a curve: a station's
  // share is its own stroke count over its burst rate, which is how long the
  // making takes, and between two stations is a transit of a fixed number of
  // seconds because nothing is being painted during one. The holds are not in
  // here -- a hold stops tau rather than consuming it.
  const specs = [];
  STS.forEach(sn => sn.canvases.forEach(c => { c._st = sn._i; specs.push(c); }));
  const counts = specs.map(c => c.strokes || 1);
  const total = counts.reduce((a, b) => a + b, 0);
  const AXIS = [];
  // how many seconds of the making a station is: its own strokes over its own
  // burst rate, or -- with no strokes -- the beat it declares.
  // M8: a canvas may stop. `stop` is the fraction of its own strokes the piece
  // lays, and what is past it is never laid at all, so a stopped canvas's share
  // of tau is the part of it that is painted. One canvas in the piece has one.
  const laid = c => (c.strokes || 1) * clamp01(c.stop ?? 1);
  const stationS = sn => {
    const n = sn.canvases.reduce((a, c) => a + laid(c), 0);
    return n ? n / (sn.pacing?.burst ?? 2000) : (sn.pacing?.beat ?? 6);
  };
  {
    let clock = 0;
    STS.forEach((sn, i) => {
      if (i) {
        const secs = roadS(STS[i - 1], sn);
        AXIS.push({ kind: 'transit', a: i - 1, b: i, secs, t0: clock, t1: clock += secs });
      }
      // A station with no canvases in it at all. Station 7 is one, and it is
      // the only one: the strokes stop, and the stopping is what is there.
      // Its share of tau is a declared number of seconds rather than a stroke
      // count over a burst rate, because there is no paint for a rate to be a
      // rate of -- the same arithmetic a transit already uses, and for the same
      // reason. DESIGN 7 gives it no treatment column at all and it is right.
      AXIS.push({ kind: 'station', i, t0: clock, t1: clock += stationS(sn) });
    });
    const T = clock || 1;
    for (const a of AXIS) { a.lo = a.t0 / T; a.hi = a.t1 / T; }
    for (const a of AXIS) {
      if (a.kind !== 'station') continue;
      const cs = STS[a.i].canvases;
      const n = cs.reduce((x, c) => x + laid(c), 0);
      let acc = 0;
      for (const c of cs) {
        c._lo = a.lo + (a.hi - a.lo) * acc / n;
        acc += laid(c);
        c._hi = a.lo + (a.hi - a.lo) * acc / n;
      }
    }
  }
  // the gates of the refusal below: one at the end of the making of every
  // station whose pacing says `refuse`, which is station 7's and nobody else's
  for (const a of AXIS)
    if (a.kind === 'station' && STS[a.i].pacing?.refuse > 0)
      GATES.push({ i: a.i, lo: a.lo, at: a.hi + 2e-7,
                   refuse: num('refuse', STS[a.i].pacing.refuse),
                   state: 'armed', since: 0, log: [] });
  // ?begin=N: stand at the start of station N inside the whole arc, which is
  // what a person testing station 7 needs -- ?station=N loads that station
  // alone, and a station alone has no road into it and nothing before it.
  if (Q.has('begin')) {
    const a = AXIS.find(x => x.kind === 'station' && STS[x.i].id === +Q.get('begin'));
    if (a) scrub = a.lo + 1e-6;
  }
  // where tau is: inside a station's making, or on the road between two.
  const axisAt = t => {
    for (let i = 0; i < AXIS.length; i++) {
      const a = AXIS[i];
      if (t <= a.hi || i === AXIS.length - 1)
        return { a, u: a.hi > a.lo ? clamp01((t - a.lo) / (a.hi - a.lo)) : 0 };
    }
    return { a: AXIS[0], u: 0 };
  };
  const stationAt = t => {
    const { a, u } = axisAt(t);
    return STS[a.kind === 'station' ? a.i : (u < 0.5 ? a.a : a.b)];
  };
  // and where the body is carried to. The path is one way and it is eased at
  // both ends, so the crossing starts and stops without a jerk and tau itself
  // never jumps -- it is the same scalar throughout, and the position is a
  // continuous function of it.
  const smooth = x => x * x * (3 - 2 * x);
  const baseAt = (t, out) => {
    const { a, u } = axisAt(t);
    if (a.kind === 'station') return out.copy(STS[a.i]._origin);
    const p = STS[a.a]._origin, q = STS[a.b]._origin, k = smooth(u);
    return out.set(p.x + (q.x - p.x) * k, p.y + (q.y - p.y) * k);
  };
  const fetched = new Array(specs.length).fill(null);
  let arrived = 0;

  async function pull(i) {
    if (fetched[i]) return fetched[i];
    const t0 = performance.now();
    const res = await fetch(specs[i].blob);
    if (!res.ok) throw new Error(`${res.status} ${res.statusText}`);
    const t1 = performance.now();
    const blob = readBlob(await res.arrayBuffer());
    if (specs[i].strokes && specs[i].strokes !== blob.count)
      console.warn(`${specs[i].blob}: the station says ${specs[i].strokes} strokes, ` +
                   `the blob has ${blob.count}. The station's timing is stale.`);
    const cv = buildCanvas(specs[i], blob);
    // BUILD M4 asks that entering a station never stall the frame, so the cost
    // of arriving is measured rather than asserted: buildCanvas is synchronous
    // and this is the one hitch in the piece.
    cv.fetchMs = +(t1 - t0).toFixed(1);
    cv.buildMs = +(performance.now() - t1).toFixed(1);
    cv.readyAt = +(performance.now() / 1000).toFixed(2);
    cv.lo = specs[i]._lo; cv.hi = specs[i]._hi; cv.stop = clamp01(specs[i].stop ?? 1);
    canvases[i] = cv;
    fetched[i] = cv;
    arrived++;
    rebuildActs();
    rebuildPresence();
    return cv;
  }

  // The first one that will load, rather than the first one. With three
  // stations the first canvas of the piece and the first canvas of the only
  // directory of blobs were the same thing; with ten, a single canvas missing
  // at station 1 would have taken the whole arc down. It still fails hard when
  // *nothing* loads, because then there is nothing to show and saying so is the
  // point of rule 2's failure path.
  const firstFew = [];
  for (let i = 0; i < specs.length; i++) {
    try { await pull(i); break; } catch (e) { firstFew.push(`${specs[i].blob}: ${e.message}`); }
  }
  if (!arrived) {
    loading = false;
    fail('The strokes did not load.',
         'The page needs the packed blobs that tools/extract.py and tools/pack.py ' +
         'produce, served over http rather than opened from the file system.',
         `${firstFew.join('\n')}\n\n  python3 -m http.server 8710`);
    return;
  }
  loading = false;

  // the rest, nearest to the scrub first. A blob that does not arrive is
  // skipped and named rather than ending the queue: this loop used to break on
  // the first failure, which with three stations and one directory of blobs was
  // invisible, and with ten stations and twenty-six canvases means one missing
  // file silently drops every canvas after it in tau order. M6 found it by
  // having two of a station's six not built yet and watching the other four
  // fail to appear.
  const missing = [];
  state.missing = missing;
  (async () => {
    const tried = new Set(specs.map((_, i) => i).filter(i => !fetched[i] &&
      firstFew.some(m => m.startsWith(specs[i].blob + ':'))));
    for (const i of tried) missing.push(specs[i].blob);
    while (arrived + missing.length < specs.length) {
      let best = -1, bd = Infinity;
      for (let i = 0; i < specs.length; i++) {
        if (fetched[i] || tried.has(i)) continue;
        const d = Math.max(specs[i]._lo - scrub, scrub - specs[i]._hi, 0);
        if (d < bd) { bd = d; best = i; }
      }
      if (best < 0) break;
      tried.add(best);
      state.streaming = specs[best].blob;
      try {
        await pull(best);
      } catch (e) {
        missing.push(specs[best].blob);
        console.warn(specs[best].blob, e.message);
      }
    }
    state.streaming = missing.length ? `done, ${missing.length} missing` : 'done';
  })();

  // ------------------------------------------------------------ the chunks --
  // A few dozen chunks is a loop that never touches a stroke. Three things come
  // out of it: a chunk entirely past the scrub is not drawn at all, a chunk
  // outside the frustum is not drawn at all, and a chunk that is drawn is drawn
  // only as far as the scrub has reached -- because it is order-sorted, so the
  // arrived strokes are a prefix and the scrub is the instance *count*.
  const frustum = new THREE.Frustum(), pv = new THREE.Matrix4(), tmpBox = new THREE.Box3();
  const tmpV = new THREE.Vector3();
  let shownNear = 0, shownMid = 0, chunksDrawn = 0, chunkTotal = 0;
  function updateChunks() {
    pv.multiplyMatrices(cam.projectionMatrix, cam.matrixWorldInverse);
    frustum.setFromProjectionMatrix(pv);
    // ?flat uses an orthographic camera, which has no fov: reading one off it
    // gives NaN, and NaN compares false, so every chunk silently fell to the
    // mid tier -- in the one mode whose whole job is to agree with tools/flat.py
    // pixel for pixel.
    const px = cam.isPerspectiveCamera
      ? renderer.domElement.height / (2 * Math.tan(THREE.MathUtils.degToRad(cam.fov) / 2))
      : Infinity;
    shownNear = shownMid = chunksDrawn = chunkTotal = 0;
    for (const cv of canvases) {
      if (!cv) continue;
      const local = (scrub - cv.lo) / Math.max(cv.hi - cv.lo, 1e-9);
      const sc = (cv.stop ?? 1) * Math.max(0, Math.min(1, local));
      cv.uni.uScrub.value = sc;
      cv.clothUni.uPrimed.value = Math.min(1, Math.max(0, (sc - 0.004) / 0.09));
      // and not drawn at all once its own station is dark. Dimming to black is
      // not enough: a station six hundred metres back is a black silhouette
      // against the primed white cloth of a station that has not been painted
      // yet, which is more conspicuous than the lit thing was. The cut happens
      // where the dim already reached zero, which is a hundred metres out and
      // in the dark, so nothing is seen to go.
      cv.group.visible = (sc > 0 || has('noStrokes')) && cv.sn._dim.value > 0.004;
      chunkTotal += cv.chunkList.length;
      // and a canvas the walk has handed away submits no geometry at all. The
      // vertex shader was already collapsing its strokes to nothing, which
      // saves the fill and not the vertices -- three Bedrooms' worth of ribbon
      // was being swept every frame so that two thirds of it could be thrown
      // away. The group stays visible either way, because the group also holds
      // the room's own cloth and the room does not go anywhere.
      if (!cv.group.visible || cv.presence.value <= 0.002) {
        for (const c of cv.chunkList) { c.mesh.near.visible = c.mesh.mid.visible = false; }
        continue;
      }
      cv.shownNear = cv.shownMid = cv.drawn = 0;
      for (const c of cv.chunkList) {
        let near = null;
        if (c.olo <= sc) {
          tmpBox.copy(c.aabb).applyMatrix4(cv.group.matrixWorld);
          if (frustum.intersectsBox(tmpBox)) {
            // screen-space stroke width, which is what the tier is chosen by --
            // not distance, because a canvas hung as a wall and a canvas lying
            // out to the horizon are nothing like the same magnification
            const d = Math.max(0.05, cam.position.distanceTo(
              tmpV.copy(c.centre).applyMatrix4(cv.group.matrixWorld)));
            const m = cv.lifted ? d / cv.uni.uShortM.value : cv.scale;
            const wpx = c.wmax * cv.blob.widthK * cv.uni.uShortM.value * m / d * px;
            near = wpx >= num('midpx', TIERS[tier].midpx);
          }
        }
        const n = near === null ? 0 : (c.ohi <= sc ? c.count
                  : upperBound(cv.orders, c.first, c.first + c.count, sc) - c.first);
        c.mesh.near.visible = near === true && n > 0;
        c.mesh.mid.visible = near === false && n > 0;
        c.mesh.near.geometry.instanceCount = c.mesh.near.visible ? n : 0;
        c.mesh.mid.geometry.instanceCount = c.mesh.mid.visible ? n : 0;
        if (n > 0 && near !== null) { cv.drawn++; near ? cv.shownNear += n : cv.shownMid += n; }
      }
      shownNear += cv.shownNear; shownMid += cv.shownMid; chunksDrawn += cv.drawn;
    }
  }
  function upperBound(a, lo, hi, x) {           // first index past x, a sorted
    while (lo < hi) { const m = (lo + hi) >> 1; if (a[m] <= x) lo = m + 1; else hi = m; }
    return lo;
  }

  // ------------------------------------------------------- the walk --------
  const keys = new Set();
  // The first canvas that actually arrived, not the first that was asked for.
  // This was `canvases[0]` and could not be anything else while pull(0) was
  // fatal; now that a missing blob is skipped, index 0 can be a hole, and
  // reading .blob off it threw inside the debug state getter -- which is to say
  // the page rendered perfectly and every measurement in the harness vanished.
  const first = canvases.find(c => c) || canvases[0];

  const resize = () => {
    renderer.setSize(innerWidth, innerHeight);
    if (flatMode) {
      const a = first.tileM[0] / first.tileM[1], s = first.tileM[1] * first.scale * 0.5;
      cam.position.set(0, first.hang, 40); cam.lookAt(0, first.hang, 0);
      const va = innerWidth / innerHeight;
      const w = va > a ? s * va : s * a, h = va > a ? s : s * a / va;
      cam.left = -w; cam.right = w; cam.top = h; cam.bottom = -h;
    } else { cam.aspect = innerWidth / innerHeight; }
    cam.updateProjectionMatrix();
  };
  addEventListener('resize', resize);

  const look = (dx, dy) => {
    body.yaw -= dx * 0.0022;
    body.pitch = Math.max(-1.45, Math.min(1.45, body.pitch - dy * 0.0022));
  };
  let dragging = false;
  // DESIGN 6: drag to look, click for pointer lock. A held lock already sends
  // every pointer event here, and capture under a lock throws InvalidStateError,
  // which from M0a to M8 stopped the page on the second click. Capture only keeps
  // a drag alive past the window's edge, so nothing about it may be fatal.
  renderer.domElement.addEventListener('pointerdown', e => {
    dragging = true;
    if (!document.pointerLockElement) try { e.target.setPointerCapture(e.pointerId); } catch {}
  });
  renderer.domElement.addEventListener('pointerup', () => { dragging = false; });
  renderer.domElement.addEventListener('pointermove', e => {
    if (document.pointerLockElement || dragging) look(e.movementX, e.movementY);
  });
  renderer.domElement.addEventListener('click', () => {
    // Current Chrome answers with a promise, and a refused lock (the in-app
    // pane refuses it outright) rejects it. Drag still looks; not an error.
    if (!document.pointerLockElement) renderer.domElement.requestPointerLock?.()?.catch?.(() => {});
  });
  addEventListener('keydown', e => {
    keys.add(e.code);
    // a held key repeats, and a toggle read from every repeat flickers
    if (e.code === 'KeyZ' && !e.repeat) body.lying = body.lying > 0.5 ? 0 : 1;
    if (e.code === 'KeyC') showCaption();
  });
  addEventListener('keyup', e => keys.delete(e.code));
  // a hand on the scrub takes it from the playing, the wheel as much as the arrows
  addEventListener('wheel', e => { pushScrub(scrub - e.deltaY * 0.0006, 'wheel'); playing = false; },
                   { passive: true });

  // ---------------------------------------------------- the viewing volume --
  // DESIGN 4.4's rule, and the thing DESIGN 15 is most afraid of. Inside it you
  // walk freely; at its edge you are eased back over `ease` metres, and the
  // return is a return -- never a collider, never a stop, and the way out is
  // the scrub, which is the transport.
  //
  // The z half is measured: tools/place.py reports where the lifted paint has
  // thinned to a quarter of the density it has underfoot. The x half is chosen.
  // Which of the two is right is exactly what the instrument below is for.
  // Per station, and read per frame rather than captured, because the body
  // walks inside whichever one tau is in and the two are not the same size.
  //
  // M5 adds a centre, because a room is not centred on where the painter put
  // the easel: at station 5 the walls stand 2.4 m to the left of the standpoint
  // and 0.8 m to its right, and a volume symmetric about the standpoint would
  // walk you through one of them. It defaults to the standpoint, so nothing
  // that had no opinion about it has changed.
  const volOf = sn => sn.volume || { half: [9, 9], ease: 1.5 };
  let VOL = volOf(st);
  let HX = num('volx', VOL.half[0]), HZ = num('volz', VOL.half[1]);
  let CX = VOL.centre?.[0] ?? 0, CZ = VOL.centre?.[1] ?? 0;
  let EASE = VOL.ease ?? 1.5;
  const RETURN = 1.8;                              // m/s, above the walk's 1.45
  const NEAR_EDGE = 0.5, EDGE_LIMIT = 0.20;        // BUILD M3's own numbers
  const edgeDist = (x, z) => Math.min(HX - Math.abs(x - CX), HZ - Math.abs(z - CZ));
  // M6 adds one more counter, and it is the one DESIGN 15 asked for in the
  // first place. `near` counts time spent within half a metre of the boundary,
  // which any walker with a net forward drift accumulates simply by arriving
  // there and stopping -- and the sweep that said the amble needs a slab 100 by
  // 80 metres was measuring the *walk*, not the volume: forty seconds at 1.45
  // m/s is 58 metres, and a box bigger than the walk is a box the walk cannot
  // reach the edge of. `press` counts something else: time in which the viewer
  // is holding a key that would take them further out and the ground is taking
  // them back. That is 'trying to leave' rather than 'standing at the edge',
  // which is the third of the three answers M3 wrote down and the only one that
  // is a measurement rather than a decision.
  const walk = { t: 0, near: 0, moving: 0, movingNear: 0, out: 0, far: 0, press: 0 };

  const volBox = has('volume') ? new THREE.Group() : null;
  if (volBox) {
    scene.add(volBox);
    for (const sn of STS) {
    const g = new THREE.BufferGeometry();
    const pts = [];
    const V = volOf(sn);
    const HX = V.half[0], HZ = V.half[1], EASE = V.ease ?? 1.5;
    const CX = V.centre?.[0] ?? 0, CZ = V.centre?.[1] ?? 0;
    const terrainJS = (x, z) => swellAt(sn._SW, x, z);
    const ring = (h, ax, az) => {
      const c = [[CX + ax, CZ + az], [CX - ax, CZ + az],
                 [CX - ax, CZ - az], [CX + ax, CZ - az]];
      for (let i = 0; i < 4; i++) {
        const a = c[i], b = c[(i + 1) % 4];
        for (let k = 0; k < 12; k++) {                 // follow the swell
          const p = [a[0] + (b[0] - a[0]) * k / 12, a[1] + (b[1] - a[1]) * k / 12];
          const q = [a[0] + (b[0] - a[0]) * (k + 1) / 12, a[1] + (b[1] - a[1]) * (k + 1) / 12];
          pts.push(p[0], terrainJS(p[0], p[1]) + h, p[1],
                   q[0], terrainJS(q[0], q[1]) + h, q[1]);
        }
      }
    };
    ring(0.02, HX, HZ); ring(1.65, HX, HZ); ring(0.02, HX + EASE, HZ + EASE);
    for (const c of [[CX + HX, CZ + HZ], [CX - HX, CZ + HZ],
                     [CX - HX, CZ - HZ], [CX + HX, CZ - HZ]])
      pts.push(c[0], terrainJS(c[0], c[1]) + 0.02, c[1],
               c[0], terrainJS(c[0], c[1]) + 1.65, c[1]);
    g.setAttribute('position', new THREE.Float32BufferAttribute(pts, 3));
    const vm = new THREE.LineSegments(g, new THREE.LineBasicMaterial({ color: 0x66ffcc }));
    vm.frustumCulled = false;
    vm.position.set(sn._origin.x, 0, sn._origin.y);
    volBox.add(vm);
    }
  }

  // --------------------------------------------------------------- the scrub --
  const bandFill = document.getElementById('bandfill');
  const knob = document.getElementById('bandknob');
  const slider = document.getElementById('scrubinput');
  const whenEl = document.getElementById('when');
  const setScrub = t => {
    scrub = Math.max(0, Math.min(1, t));
    for (const cv of canvases) if (cv) cv.uni.uScrub.value = (cv.stop ?? 1) *
      Math.max(0, Math.min(1, (scrub - cv.lo) / Math.max(cv.hi - cv.lo, 1e-9)));
    // which station this is, and everything that is a fact about a station
    // rather than about the piece: how big the volume is, how fast it paints,
    // and what the cloth under it is. They are re-read here rather than
    // captured, because tau moves between two of them now.
    const was = st;
    st = stationAt(scrub);
    if (st !== was) {
      VOL = volOf(st);
      HX = num('volx', VOL.half[0]); HZ = num('volz', VOL.half[1]);
      CX = VOL.centre?.[0] ?? 0; CZ = VOL.centre?.[1] ?? 0;
      EASE = VOL.ease ?? 1.5;
      BURST = st.pacing?.burst ?? 2000; HOLD = st.pacing?.hold ?? 2.4;
    }
    state.station = st.lone ? 'one canvas, no station'
      : `${st.id} ${st.title}` + (axisAt(scrub).a.kind === 'transit' ? '  (on the road)' : '');
    // the primed cloth dims as the *station* is painted, not as the piece is
    const { a, u } = axisAt(scrub);
    // On the road the ground goes from the one that has been painted back to
    // primed cloth, because that is what the next station is standing on until
    // it is painted. Smoothly, and in the dark, so there is nothing to see.
    const local = a.kind === 'station' ? u : 1 - smooth(u);
    // and a station that is bare stays bare: nothing is painted at 11, so the
    // cloth there is the primed canvas of station 0 however far tau has gone
    const bare = a.kind === 'station' && STS[a.i].ground?.bare;
    const primed = bare ? 0 : Math.min(1, Math.max(0, (local - 0.004) / 0.30));
    floorUni.uPrimed.value = primed;
    domeUni.uPrimed.value = primed;
    // station 0's charcoal line is station 0's. The end is primed canvas with
    // nothing on it, and a line under the standpoint there would be a road.
    floorUni.uLine.value = st.ground?.bare ? 0 : 1;
    // DESIGN 4.5: the cloth under the world roughens in 1889, because he ran
    // out of canvas at Saint-Remy and painted on jute. It changes on the road
    // between the two, which is the year it changed in.
    const A = STS[a.kind === 'station' ? a.i : a.a], B = STS[a.kind === 'station' ? a.i : a.b];
    const k = a.kind === 'station' ? 0 : smooth(u);
    floorUni.uWeaveM.value = (A._weaveMm + (B._weaveMm - A._weaveMm) * k) / 1000 * 3.6;
    floorUni.uWeaveRough.value = A._rough + (B._rough - A._rough) * k;
    floorUni.uSwell.value.copy(st._SW);
    floorUni.uSwellC.value.set(st._origin.x, st._origin.y);
    if (slider) slider.value = String(scrub);
    paintBand();
  };

  // ---------------------------------------------------- burst and hold --
  // BUILD.md M2 fixes the compression constant and it is one constant for the
  // whole piece so that every relative tempo stays true. The rate he worked at
  // is measured rather than assumed: 2.75 strokes a square centimetre, within
  // six percent across three canvases spanning three times the area and three
  // stations, so a canvas of the Reaper's size is something like ten hours of
  // painting -- about half a stroke a second. DESIGN 5.2's burst is 2,000 a
  // second, so the constant is 4,000x, and the absolute rate is fiction in a
  // way no version of this avoids.
  //
  // The hold is not compressed by it. A hold stands for the gap between two
  // painting sessions, and a night at 4,000x would be eleven seconds of
  // nothing: it is a punctuation mark, fixed at 2.4 s, and what the record
  // supplies is how *many* there are, not how long. Acts are where they go,
  // because an act boundary is where the sequence itself changed its mind about
  // what it was laying down.
  let BURST = st.pacing?.burst ?? 2000, HOLD = st.pacing?.hold ?? 2.4;
  let playing = has('play'), held = 0;
  // M8: the last thing that plays itself is the rush. Past the last stroke of
  // the last canvas there is nothing left to paint, so "let it paint itself"
  // has nothing to do, and the road off the end of the field and what is at
  // the end of it are reached with a hand on the scrub or not at all. BUILD M8
  // asks that the ending be something the viewer did; this is the line that
  // makes that true rather than likely.
  const PLAY_END = specs.length ? Math.max(...specs.map(c => c._hi)) : 1;
  const actAt = t => {
    let i = 0;
    while (i < actList.length - 1 && t > actList[i].hi) i++;
    return i;
  };

  // ------------------------------------------------------- the refusal ---
  // DESIGN 7, station 7: the painting stops mid-canvas, the brush cuts, and
  // the scrub refuses to advance for a beat. M6 built the last clause for the
  // one hand that did not need it -- space, the scrub playing itself -- and
  // left every other way of moving tau sailing straight through December 1888,
  // and a refusal the viewer's own hand never meets is not a refusal. So every
  // way forward comes through here: the arrows, the wheel, the band, the
  // slider and the playing. The first move across a gate lands on it and
  // stays there for `refuse` seconds of the viewer's own time, however hard
  // they push, and then the gate is open and the scrub goes on. Going back
  // before the station began arms it again, because it is a fact about the
  // date and not an event that gets used up. Backwards is never refused.
  //
  // It keeps a log, because M8's exit criterion is a stranger at this gate
  // and this is what they did there: how they arrived, how many times they
  // pushed and for how long they held the arrow, whether they left before it
  // opened, and how long after it opened they moved on. vg.beats() reads it.
  const nowS = () => performance.now() / 1000;
  const bandEl = document.getElementById('band');
  let refusedTimer = 0, nudgeAt = -1;
  const refusedUI = () => {
    if (!bandEl) return;
    // a held arrow pushes on every frame, and restarting the nudge on each one
    // held it on its first frame, so the knob never moved: a push lands a new
    // nudge only once the last has run its .45 s
    const now = performance.now();
    if (now - nudgeAt > 450) {
      nudgeAt = now;
      bandEl.classList.remove('refused');
      void bandEl.offsetWidth;                     // restart the nudge
    }
    bandEl.classList.add('refused', 'open');
    clearTimeout(refusedTimer);
    refusedTimer = setTimeout(() => bandEl.classList.remove('refused', 'open'), 1400);
  };
  const pushScrub = (t, how) => {
    t = Math.max(0, Math.min(1, t));
    const now = nowS();
    if (t > scrub) for (const g of GATES) {
      const e = g.log[g.log.length - 1];
      if (g.state === 'open') {
        // the first move on after it opened, by a hand, and how long it took
        if (e && e.next === null && how !== 'play' && scrub <= g.at + 1e-9)
          e.next = +(now - g.since - g.refuse).toFixed(2);
        continue;
      }
      if (scrub > g.at + 1e-9 || t <= g.at) continue;
      if (g.state === 'armed') {
        g.state = 'refusing'; g.since = now;
        g.log.push({ at: +now.toFixed(2), how, pushes: 0, keySeconds: 0,
                     opened: null, left: null, next: null });
        brush.cut();
      } else if (e && how !== 'play' && how !== 'key' && how !== 'drag') e.pushes++;
      if (how !== 'play') refusedUI();
      t = g.at;
      break;
    }
    setScrub(t);
  };
  const tickGates = dt => {
    const now = nowS();
    for (const g of GATES) {
      const e = g.log[g.log.length - 1];
      if (g.state === 'refusing') {
        if (e && keys.has('ArrowRight')) e.keySeconds += dt;
        if (now - g.since >= g.refuse) {
          g.state = 'open';
          if (e) e.opened = +(now - g.since).toFixed(2);
          brush.uncut();
        }
      }
      if (g.state !== 'armed' && scrub < g.lo - 1e-9) {
        if (g.state === 'refusing' && e) { e.left = +(now - g.since).toFixed(2); brush.uncut(); }
        g.state = 'armed';
      }
    }
  };

  const advance = dt => {
    if (!total) return;
    if (scrub >= PLAY_END - 1e-9) { playing = false; return; }
    if (held > 0) { held = Math.max(0, held - dt); return; }
    // Inside a station tau advances at that station's burst rate over that
    // station's own strokes; on the road it advances at the transit's own
    // duration, because nothing is being painted there and the burst rate has
    // nothing to be a rate of.
    const { a } = axisAt(scrub);
    const span = a.hi - a.lo;
    let step;
    if (a.kind === 'transit') step = dt / Math.max(a.secs, 1e-6) * span;
    else step = dt / Math.max(stationS(STS[a.i]), 1e-6) * span;
    const next = scrub + step;
    if (next >= PLAY_END) { pushScrub(PLAY_END, 'play'); playing = false; return; }
    const k = actAt(scrub);
    if (k < actList.length - 1 && next > actList[k].hi) {
      pushScrub(actList[k].hi + 1e-6, 'play');
      held = HOLD;
      return;
    }
    pushScrub(next, 'play');
  };
  addEventListener('keydown', e => {
    if (e.code !== 'Space') return;
    e.preventDefault();
    // held, a key repeats: a toggle that read the repeats flickered play on
    // and off for as long as space was down and left it wherever they ended
    if (e.repeat) return;
    if (scrub >= 1) { setScrub(0); held = 0; }
    // past the last stroke there is nothing left to paint, so nothing to play
    else if (scrub >= PLAY_END - 1e-9) return;
    playing = !playing;
  });

  // ------------------------------------------------------- the timeline ----
  // DESIGN 11: a thin band at the bottom edge -- ten years, the station marks,
  // the date and the position -- and it is the only persistent chrome. It
  // thins to a hairline when the pointer is away from it. The ten years are
  // real and the station marks are where those stations fall in them.
  //
  // M4 makes tau the global axis, and the two axes here are not the same thing
  // and must not be confused. tau is time in the *piece* -- uniform, because it
  // is what the scrub drags -- and it is spent where the painting is: two weeks
  // in June 1888 get as much of it as their strokes earn, and the eleven months
  // after get a sixteen-second transit. The band is the ten years, real and
  // linear, so the handle crosses it in lurches. That is DESIGN 5.1's
  // non-linear mapping, and what makes it non-linear is the record.
  const T0 = Date.UTC(1880, 7, 1), T1 = Date.UTC(1890, 6, 29);
  const frac = iso => (Date.parse(iso) - T0) / (T1 - T0);
  // where the ten marks sit in the ten years. A station that is loaded says so
  // itself -- its span is the same field tools/station.py audits every canvas
  // against -- and the fallback list is for the ones this build did not load,
  // so that ?station=4 still draws a band with ten marks on it rather than one.
  // Two sources of truth for the same dates is how a station ends up in one
  // place on the band and another in the caption.
  const FALLBACK = [['1885-04-01', 1], ['1886-03-01', 2], ['1888-02-21', 3],
                    ['1888-06-05', 4], ['1888-08-18', 5], ['1888-09-05', 6],
                    ['1888-12-23', 7], ['1889-05-08', 8], ['1890-05-21', 9],
                    ['1890-07-08', 10]];
  const MARKS = FALLBACK.map(([iso, n]) => {
    const sn = STS.find(x => x.id === n);
    return [sn?.span?.[0] ?? iso, n];
  });
  const spanOf = sn => {
    if (sn.span) return [frac(sn.span[0]), frac(sn.span[1])];
    const m = MARKS.find(k => k[1] === sn.id);
    const c = m ? frac(m[0]) : 0.5;
    return [c - 0.004, c + 0.004];
  };
  const dateAt = t => {
    const { a, u } = axisAt(t);
    if (a.kind === 'station') { const sp = spanOf(STS[a.i]); return sp[0] + (sp[1] - sp[0]) * u; }
    const p = spanOf(STS[a.a])[1], q = spanOf(STS[a.b])[0];
    return p + (q - p) * smooth(u);
  };
  const MONTH = ['January', 'February', 'March', 'April', 'May', 'June', 'July',
                 'August', 'September', 'October', 'November', 'December'];
  const dateText = f => {
    const d = new Date(T0 + f * (T1 - T0));
    return `${MONTH[d.getUTCMonth()]} ${d.getUTCFullYear()}`;
  };
  const band = document.getElementById('band');
  const markEls = [];
  if (band) {
    for (const [iso, n] of MARKS) {
      const d = document.createElement('i');
      d.style.left = (frac(iso) * 100).toFixed(3) + '%';
      d.dataset.n = n;
      band.appendChild(d);
      markEls.push([n, d]);
    }
    const openBand = e => band.classList.toggle('open', innerHeight - e.clientY < 96);
    addEventListener('pointermove', openBand);
    // and dragging it is the inverse: the band is dated, so a click somewhere in
    // the ten years has to come back as the tau that stands there. dateAt is
    // monotone, so twenty bisections put it inside a day.
    const bandAt = e => {
      const r = band.getBoundingClientRect();
      const want = (e.clientX - r.left) / r.width;
      let lo = 0, hi = 1;
      for (let k = 0; k < 20; k++) {
        const mid = 0.5 * (lo + hi);
        if (dateAt(mid) < want) lo = mid; else hi = mid;
      }
      return 0.5 * (lo + hi);
    };
    // M8: the drag this comment promised, now that the keyboard's slider no
    // longer lies over the band and drags it by tau instead of by the date. A
    // drag is one push at station 7's gate, however many moves it is made of.
    let bandDrag = false;
    band.addEventListener('pointerdown', e => {
      bandDrag = true;
      try { band.setPointerCapture(e.pointerId); } catch {}
      pushScrub(bandAt(e), 'band');
      playing = false;
    });
    band.addEventListener('pointermove', e => { if (bandDrag) pushScrub(bandAt(e), 'drag'); });
    band.addEventListener('pointerup', () => { bandDrag = false; });
    band.addEventListener('pointercancel', () => { bandDrag = false; });
  }
  if (slider) {
    slider.addEventListener('input', () => { pushScrub(parseFloat(slider.value), 'slider'); playing = false; });
    slider.addEventListener('focus', () => band?.classList.add('open'));
    slider.addEventListener('blur', () => band?.classList.remove('open'));
  }
  const canvasAt = t => {
    for (let i = specs.length - 1; i >= 0; i--) if (t >= specs[i]._lo) return i;
    return 0;
  };
  function paintBand() {
    if (!bandFill) return;
    const w = dateAt(scrub);
    bandFill.style.width = (w * 100).toFixed(3) + '%';
    if (knob) knob.style.left = (w * 100).toFixed(3) + '%';
    for (const [n, el] of markEls) el.className = n === (st.id ?? -1) ? 'now' : '';
    if (whenEl) {
      const { a, u } = axisAt(scrub);
      // M8: two stations say their own date and nothing else. At the gate the
      // readout gains a day, for the only time in the piece, because the
      // station's date is a day; and at the end there is no date at all.
      const gate = GATES.find(g => Math.abs(scrub - g.at) < 1e-6);
      if (gate) {
        whenEl.textContent = STS[gate.i].when || '';
      } else if (a.kind === 'transit') {
        whenEl.textContent = dateText(dateAt(scrub)) + '  ·  on the road';
      } else if (!STS[a.i].canvases.length) {
        whenEl.textContent = STS[a.i].when || '';
      } else {
        const i = canvasAt(scrub), act = actList[actAt(scrub)];
        whenEl.textContent = (specs[i].date || st.when || '') +
          (act && act.name !== '...' ? '  ·  ' + act.name : '');
      }
    }
  }

  // --------------------------------------------------------- the caption ---
  // DESIGN 11's gallery plaque: the painting, its date, its collection. It
  // fades rather than persisting, and it comes back on C or with the pointer in
  // its corner, because this one also carries what is measured and what is not
  // and that is worth being able to re-read.
  const capEl = document.getElementById('caption');
  const captEl = document.getElementById('capt'), capsEl = document.getElementById('caps');
  let capTimer = 0, capShown = -1;
  const firstOf = sn => specs.findIndex(c => c._st === sn._i);
  function showCaption(i) {
    if (!capEl) return;
    const k = i ?? canvasAt(scrub);
    const cv = specs[k];
    const sn = STS[cv._st ?? 0];
    if (sn.caption && (k === firstOf(sn) || sn.lone)) {
      captEl.textContent = sn.caption.title;
      capsEl.textContent = sn.caption.sub;
    } else if (!sn.lone) {
      captEl.textContent = cv.title || '';
      capsEl.textContent = [cv.date, cv.place, cv.collection].filter(Boolean).join(' · ') +
        (cv.note ? '  ' + cv.note : '');
    }
    capEl.classList.remove('dim');
    clearTimeout(capTimer);
    capTimer = setTimeout(() => capEl.classList.add('dim'), 4200);
    capShown = k;
  }
  addEventListener('pointermove', e => {
    if (e.clientX < 460 && innerHeight - e.clientY < 190 && capEl?.classList.contains('dim'))
      showCaption();
  });

  // ---------------------------------------------------------- the letter ---
  // DESIGN 9: one line from his own letters per station, appearing in the air
  // as you reach the canvas it describes, small, and fading after several
  // seconds. His words, not ours: each one is in its station file only because
  // tools/letters.py found it in the named paragraph of the Van Gogh Museum and
  // Huygens edition, and the recipient, the place and the date beside it are
  // the edition's own words. This shows what it is given and adds nothing.
  const letEl = document.getElementById('letter');
  const letQ = document.getElementById('lettq'), letC = document.getElementById('lettc');
  const LETTERS = [];
  for (const sn of STS) {
    const L = sn.letter;
    if (!L?.n || !L.text) continue;
    const k = specs.findIndex(c => c._st === sn._i &&
                              c.blob.split('/').pop().startsWith(L.canvas + '-canvas'));
    if (k < 0) {
      console.warn(`station ${sn.id}: its letter stands at '${L.canvas}', which is not one of its canvases`);
      continue;
    }
    LETTERS.push({ k, sn, L });
  }
  const citeOf = L => `to ${L.to}, ${L.place}, ${L.date}  \u00b7  letter ${L.n}`;
  // DESIGN 11: every quotation is also in the DOM as text, so the voice of the
  // piece is there for a screen reader whether or not tau has reached it.
  const listEl = document.getElementById('letterlist');
  if (listEl) for (const { sn, L } of LETTERS) {
    const li = document.createElement('li');
    li.textContent = `${sn.title}. ${L.text} (${citeOf(L)})`;
    listEl.appendChild(li);
  }
  // Long enough to read twice at the pace of small type, and never so long it
  // is still there at the next canvas.
  const letHold = L => Math.min(9, Math.max(5, 2.6 + 0.3 * L.text.split(/\s+/).length));
  // A still is a still: the letter is not in one unless ?letter asks for it,
  // which keeps every frame taken before M7 byte-identical after it.
  const letForce = has('letter');
  let letAt = -1, letShown = null, letTimer = 0, letFade = 0;
  function letterAt(k) {
    letAt = k;
    clearTimeout(letTimer); clearTimeout(letFade);
    const x = LETTERS.find(e => e.k === k);
    if (!x || x.L !== letShown) letEl?.classList.remove('on');
    if (!letEl || !x || (still && !letForce)) return;
    const show = () => {
      letQ.textContent = x.L.text;
      letC.textContent = citeOf(x.L);
      letShown = x.L;
      letEl.classList.add('on');
      if (!still) letFade = setTimeout(() => letEl.classList.remove('on'), letHold(x.L) * 1000);
    };
    // The plaque first and then his words: the caption says what the painting
    // is and fades at four seconds, and the letter arrives as it goes, so the
    // two never compete for the same seconds. In a still, at once, and the
    // caption steps back for it.
    if (still) { letEl.style.transition = 'none'; capEl?.classList.add('dim'); show(); }
    else letTimer = setTimeout(show, 4400);
  }

  // ----------------------------------------------------------- the brush ---
  // DESIGN 10: not ambience -- the brush. A stroke being laid has a sound,
  // bristle dragging on weave and the small stick of loaded oil. One is nearly
  // nothing; four thousand arriving over two seconds is a roar, and it comes
  // from the direction the paint is arriving from. When the burst ends the
  // silence is enormous, and at station 7 the silence is the event. Off by
  // default, behind one button, because it is the one thing that will make a
  // stranger close the tab in the first two seconds.
  //
  // None of it is a recording. It is noise shaped by what the record says is
  // arriving -- how many strokes crossed the scrub this frame, and where their
  // chunks stand in the world -- so its loudness is the rate he painted at and
  // its direction is where on the canvas that paint went. The mistral, the
  // cicadas and the rooks wait until this exists at scale; it is the only sound.
  const soundBtn = document.getElementById('sound');
  if (soundBtn && flatMode) soundBtn.hidden = true;
  const brush = (() => {
    // seeded, so two runs of the harness hear the same noise
    let seed = 1888;
    const rng = () => ((seed = (seed * 1664525 + 1013904223) >>> 0) / 4294967296);
    let ctx = null, on = false, master, ceil, bedGain, bedBand, bedBody, bedPan, rec = null;
    let cutG = null, cutOn = false;
    const cuts = [];
    let quiet = 0, rate = 0, az = null;
    const pans = [], grains = [], log = [], top = [];
    const dir = new THREE.Vector3(), eye = new THREE.Vector3(), w = new THREE.Vector3();
    const fw = new THREE.Vector3(), up = new THREE.Vector3(), inv = new THREE.Quaternion();
    // One stroke is nearly nothing and two thousand a second is the burst, and
    // between them the sum is incoherent: ten times the strokes is ten times the
    // power, ten decibels. Past the burst rate a hand on the scrub can go thirty
    // times faster, and that may be louder but not thirty times louder.
    const BURST_DB = -16, BED_K = 2.2, GRAIN_K = 0.035, JUMP = 20000;
    const dbOf = r => r < 2000 ? BURST_DB + 10 * Math.log10(r / 2000)
                               : BURST_DB + 4 * Math.log10(r / 2000);
    const setv = (p, v) => { p.value = v; };
    const placeAt = (p, v) => {
      if (p.positionX) { setv(p.positionX, v.x); setv(p.positionY, v.y); setv(p.positionZ, v.z); }
      else p.setPosition(v.x, v.y, v.z);
    };
    const panner = () => {
      const p = ctx.createPanner();
      p.panningModel = 'HRTF'; p.distanceModel = 'linear';
      p.refDistance = 1; p.maxDistance = 1e4; p.rolloffFactor = 0;   // distance is ours, below
      p.connect(cutG);
      return p;
    };

    function build() {
      ctx = new (window.AudioContext || window.webkitAudioContext)({ latencyHint: 'interactive' });
      const sr = ctx.sampleRate;
      master = ctx.createGain(); master.gain.value = 0;
      // everything the brush makes goes through this before the master, so
      // that station 7 can take all of it at once -- see cut()
      cutG = ctx.createGain(); cutG.gain.value = 1; cutG.connect(master);
      // A soft ceiling rather than a limiter: a roar may be loud and may not
      // clip. The curve is odd and has a point at the origin, so zero in is zero
      // out and a silence stays exactly one.
      ceil = ctx.createWaveShaper();
      const curve = new Float32Array(2049);
      for (let i = 0; i < 2049; i++) curve[i] = Math.tanh(1.3 * (i / 1024 - 1)) / Math.tanh(1.3);
      ceil.curve = curve;
      master.connect(ceil); ceil.connect(ctx.destination);

      // two seconds of noise, pinkish, because paint on cloth is not a hiss
      const noise = ctx.createBuffer(1, sr * 2, sr), nd = noise.getChannelData(0);
      let b0 = 0, b1 = 0, b2 = 0, e2 = 0;
      for (let i = 0; i < nd.length; i++) {
        const x = rng() * 2 - 1;
        b0 = 0.99765 * b0 + x * 0.0990460; b1 = 0.96300 * b1 + x * 0.2965164;
        b2 = 0.57000 * b2 + x * 1.0526913;
        nd[i] = b0 + b1 + b2 + x * 0.1848; e2 += nd[i] * nd[i];
      }
      const unit = 1 / Math.sqrt(e2 / nd.length);
      for (let i = 0; i < nd.length; i++) nd[i] *= unit;
      const bed = ctx.createBufferSource(); bed.buffer = noise; bed.loop = true;
      bedBand = ctx.createBiquadFilter(); bedBand.type = 'bandpass';
      bedBand.frequency.value = 1300; bedBand.Q.value = 0.5;
      bedBody = ctx.createBiquadFilter(); bedBody.type = 'lowshelf';
      bedBody.frequency.value = 240; bedBody.gain.value = 0;
      bedGain = ctx.createGain(); bedGain.gain.value = 0;
      bedPan = panner();
      bed.connect(bedBand); bedBand.connect(bedBody); bedBody.connect(bedGain); bedGain.connect(bedPan);
      bed.start();

      // and a dozen single strokes, each a little different: high-passed noise
      // rippled at the rate the threads go by under a brush moving a few
      // centimetres a second, and at the front of it the knock of the oil
      // letting go of the hair
      for (let g = 0; g < 12; g++) {
        const len = Math.round(sr * (0.05 + 0.09 * rng()));
        const b = ctx.createBuffer(1, len, sr), d = b.getChannelData(0);
        const weave = 120 + 360 * rng(), ph = 6.2832 * rng(), knock = 140 + 120 * rng();
        let hp = 0, x0 = 0;
        for (let i = 0; i < len; i++) {
          const t = i / sr, u = i / len, x = rng() * 2 - 1;
          hp = 0.86 * (hp + x - x0); x0 = x;
          const env = Math.min(1, u / 0.07) * Math.pow(1 - u, 1.7);
          const rip = 0.6 + 0.4 * Math.sin(6.2832 * weave * t + ph);
          const fade = Math.min(1, (1 - u) / 0.1);
          d[i] = fade * (0.55 * hp * env * rip + 0.5 * Math.sin(6.2832 * knock * t) * Math.exp(-t / 0.011));
        }
        grains.push(b);
      }
      for (let i = 0; i < 4; i++) pans.push(panner());
      if (has('soundlog')) record();
    }

    // ?soundlog: keep what came out, sample for sample and on the context's own
    // clock, for tools/listen.py to measure and for a person to listen to. A
    // worklet from a Blob, so it needs no second file and has no latency to guess.
    function record() {
      rec = { t0: null, L: [], R: [], n: 0, max: ctx.sampleRate * num('soundsecs', 40) };
      const src = "registerProcessor('tap', class extends AudioWorkletProcessor {" +
        "constructor(){super();this.L=new Float32Array(8192);this.R=new Float32Array(8192);this.n=0;this.t=-1;}" +
        "process(ins){const i=ins[0],L=i&&i[0],R=i&&(i[1]||i[0]);if(this.t<0)this.t=currentTime;" +
        "if(L){this.L.set(L,this.n);this.R.set(R,this.n);}this.n+=L?L.length:128;" +
        "if(this.n>=8192){this.port.postMessage({t:this.t,L:this.L,R:this.R},[this.L.buffer,this.R.buffer]);" +
        "this.L=new Float32Array(8192);this.R=new Float32Array(8192);this.n=0;this.t=-1;}return true;}});";
      ctx.audioWorklet.addModule(URL.createObjectURL(new Blob([src], { type: 'text/javascript' })))
        .then(() => {
          const tap = new AudioWorkletNode(ctx, 'tap', { numberOfInputs: 1, numberOfOutputs: 1,
                                                         channelCount: 2, channelCountMode: 'explicit' });
          const zero = ctx.createGain(); zero.gain.value = 0;
          tap.port.onmessage = e => {
            if (rec.n >= rec.max) return;
            if (rec.t0 === null) rec.t0 = e.data.t;
            rec.L.push(e.data.L); rec.R.push(e.data.R); rec.n += e.data.L.length;
          };
          ceil.connect(tap); tap.connect(zero); zero.connect(ctx.destination);
        })
        .catch(e => console.warn('no recording:', e.message));
    }

    function wav() {
      if (!rec || !rec.n) return null;
      const n = Math.min(rec.n, rec.max), sr = ctx.sampleRate;
      const buf = new ArrayBuffer(44 + n * 4), v = new DataView(buf);
      const tag = (o, s) => { for (let i = 0; i < 4; i++) v.setUint8(o + i, s.charCodeAt(i)); };
      tag(0, 'RIFF'); v.setUint32(4, 36 + n * 4, true); tag(8, 'WAVE'); tag(12, 'fmt ');
      v.setUint32(16, 16, true); v.setUint16(20, 1, true); v.setUint16(22, 2, true);
      v.setUint32(24, sr, true); v.setUint32(28, sr * 4, true);
      v.setUint16(32, 4, true); v.setUint16(34, 16, true);
      tag(36, 'data'); v.setUint32(40, n * 4, true);
      const q = s => Math.round(Math.max(-1, Math.min(1, s)) * 32767);
      let o = 44, k = 0;
      for (let c = 0; c < rec.L.length && k < n; c++)
        for (let i = 0; i < rec.L[c].length && k < n; i++, k++, o += 4) {
          v.setInt16(o, q(rec.L[c][i]), true); v.setInt16(o + 2, q(rec.R[c][i]), true);
        }
      let s = '';
      const u8 = new Uint8Array(buf);
      for (let i = 0; i < u8.length; i += 0x8000)
        s += String.fromCharCode.apply(null, u8.subarray(i, i + 0x8000));
      return { t0: rec.t0, sr, b64: btoa(s) };
    }

    function update(dt) {
      if (!ctx || !on) {
        // re-baselined on the way back on, so that turning it on is not a burst
        // of everything that arrived while it was off
        for (const cv of canvases) if (cv) cv._brush = null;
        return;
      }
      cam.getWorldPosition(eye);
      inv.copy(cam.quaternion).invert();
      fw.set(0, 0, -1).applyQuaternion(cam.quaternion);
      up.set(0, 1, 0).applyQuaternion(cam.quaternion);
      const Ls = ctx.listener;
      if (Ls.forwardX) {
        setv(Ls.forwardX, fw.x); setv(Ls.forwardY, fw.y); setv(Ls.forwardZ, fw.z);
        setv(Ls.upX, up.x); setv(Ls.upY, up.y); setv(Ls.upZ, up.z);
      } else Ls.setOrientation(fw.x, fw.y, fw.z, up.x, up.y, up.z);
      // what crossed the scrub this frame, chunk by chunk, and where each chunk is
      let n = 0, heard = 0;
      dir.set(0, 0, 0); top.length = 0;
      for (const cv of canvases) {
        if (!cv) continue;
        const sc = cv.uni.uScrub.value;
        const got = c => c.olo > sc ? 0 : c.ohi <= sc ? c.count
          : upperBound(cv.orders, c.first, c.first + c.count, sc) - c.first;
        if (!cv._brush) { cv._brush = { sc, n: cv.chunkList.map(got) }; continue; }
        if (sc === cv._brush.sc) continue;
        const fwd = sc > cv._brush.sc;
        cv._brush.sc = sc;
        cv.chunkList.forEach((c, j) => {
          const now = got(c), d = now - cv._brush.n[j];
          cv._brush.n[j] = now;
          if (!fwd || d <= 0) return;            // paint going backwards makes no sound
          w.copy(c.centre).applyMatrix4(cv.group.matrixWorld).sub(eye);
          const far = Math.max(0.5, w.length());
          w.divideScalar(far);
          // near paint louder than paint out on the plain, and none of it lost
          const k = d * Math.min(1, Math.max(0.3, 5 / far));
          n += d; heard += k;
          dir.addScaledVector(w, k);
          top.push([k, w.x, w.y, w.z]);
        });
      }
      const t = ctx.currentTime;
      const r = n > JUMP ? 0 : heard / Math.max(dt, 1e-3);   // a click on the band is not painting
      rate = r;
      if (r > 0) {
        quiet = 0;
        bedGain.gain.cancelScheduledValues(t);
        bedGain.gain.setTargetAtTime(Math.pow(10, dbOf(r) / 20) * BED_K, t, 0.025);
        // brighter as it thickens, and a body under it once it is a roar
        bedBand.frequency.setTargetAtTime(900 + 1100 * clamp01(Math.log10(Math.max(r, 1) / 50) / 3), t, 0.05);
        bedBody.gain.setTargetAtTime(9 * clamp01(Math.log10(Math.max(r, 1) / 800) / 1.5), t, 0.05);
        dir.normalize();
        placeAt(bedPan, dir);
        w.copy(dir).applyQuaternion(inv);
        az = Math.atan2(w.x, -w.z) * 180 / Math.PI;
        // single strokes, heard on their own when few arrive and a grain in the
        // roar when many do: as many as arrived, up to seventy a second
        top.sort((a, b) => b[0] - a[0]);
        const m = Math.min(pans.length, top.length);
        let tot = 0;
        for (let i = 0; i < m; i++) { placeAt(pans[i], w.set(top[i][1], top[i][2], top[i][3])); tot += top[i][0]; }
        const want = Math.min(n, Math.ceil(70 * dt));
        for (let e = 0; e < want; e++) {
          let u = rng() * tot, i = 0;
          while (i < m - 1 && (u -= top[i][0]) > 0) i++;
          const s = ctx.createBufferSource(), gg = ctx.createGain();
          s.buffer = grains[(rng() * grains.length) | 0];
          s.playbackRate.value = 0.8 + 0.5 * rng();
          gg.gain.value = GRAIN_K * (0.6 + 0.4 * rng());
          s.connect(gg); gg.connect(pans[i]);
          s.start(t + rng() * dt);
        }
      } else if (!quiet) {
        quiet = t;
        // the silence: a thirtieth of a second to fall, and then nothing at all --
        // not a tail, not a floor, not a room
        bedGain.gain.cancelScheduledValues(t);
        bedGain.gain.setTargetAtTime(0, t, 0.03);
        bedGain.gain.setValueAtTime(0, t + 0.25);
      }
      if (rec) log.push([+t.toFixed(4), n, Math.round(r), az === null ? null : +az.toFixed(1),
                         r > 0 ? +dbOf(r).toFixed(1) : null]);
    }

    // DESIGN 10: at station 7 the silence is the event, so it is not left to the
    // ordinary end of a burst -- a thirtieth of a second to fall, and the
    // strokes already scheduled a frame ahead still sounding into it -- but
    // cut: all of it to nothing in eight milliseconds. Eight, not zero, so
    // that the cut is a cut and not a click.
    function cut() {
      if (!ctx) return;
      const t = ctx.currentTime;
      cutG.gain.cancelScheduledValues(t);
      cutG.gain.setValueAtTime(cutG.gain.value, t);
      cutG.gain.linearRampToValueAtTime(0, t + 0.008);
      bedGain.gain.cancelScheduledValues(t);
      bedGain.gain.setValueAtTime(0, t + 0.008);
      cutOn = true;
      quiet = t;
      cuts.push(+t.toFixed(4));
    }
    // and it stays cut until the gate says otherwise. The first version let the
    // next stroke to arrive lift it, and the next stroke to arrive was the last
    // one before the stop, in the same frame: tools/beat.py heard the ordinary
    // 279 ms fall where the cut should have been.
    function uncut() {
      if (!ctx || !cutOn) return;
      cutOn = false;
      const t = ctx.currentTime;
      cutG.gain.cancelScheduledValues(t);
      cutG.gain.setValueAtTime(1, t);
    }

    function set(v) {
      if (v && !ctx) build();
      on = !!v;
      if (ctx) {
        if (on && ctx.state !== 'running') ctx.resume();
        const t = ctx.currentTime;
        master.gain.cancelScheduledValues(t);
        master.gain.setTargetAtTime(on ? 1 : 0, t, 0.04);
        if (!on) {
          master.gain.setValueAtTime(0, t + 0.3);
          setTimeout(() => { if (!on && ctx.state === 'running') ctx.suspend(); }, 450);
        }
      }
      if (soundBtn) {
        soundBtn.setAttribute('aria-pressed', String(on));
        soundBtn.textContent = on ? 'sound on' : 'sound off';
      }
      return on;
    }

    return {
      set, update, wav, cut, uncut,
      get on() { return on; },
      wake: () => { if (on && ctx && ctx.state !== 'running') ctx.resume(); },
      state: () => ({ on, running: ctx ? ctx.state : null, sr: ctx ? ctx.sampleRate : null,
                      rate: Math.round(rate), az: az === null ? null : +az.toFixed(1),
                      t0: rec ? rec.t0 : null, recorded: rec ? rec.n : 0, cuts: cuts.slice(),
                      log: rec ? log : undefined }),
    };
  })();
  soundBtn?.addEventListener('click', () => brush.set(!brush.on));
  addEventListener('keydown', e => { if (e.code === 'KeyM' && !e.repeat) brush.set(!brush.on); });
  // A browser will not start sound without a gesture, so ?sound -- the
  // harness's switch -- is heard from the first one when there is no autoplay.
  addEventListener('pointerdown', () => brush.wake());
  addEventListener('keydown', () => brush.wake());
  if (has('sound')) brush.set(true);

  // ------------------------------------------------------------ the crows --
  // DESIGN 7: crows, the only living creatures in the universe, and if the
  // viewer looks back they have been in the corner of the eye since Arles.
  // Rule 2 says what they are made of: his marks, not a modelled bird. So every
  // one of them is a bird off Wheatfield with Crows -- the two or three
  // strokes of black that tools/crows.py found in that canvas's own record --
  // standing in the world at the angle it has in the painting, which at the
  // fifty degrees every canvas is hung at is one to three degrees of sky.
  //
  // Where they fly is the one thing here that is chosen, and it has a rule:
  // never across his paint. A station's crows are in the air outside every one
  // of its canvases, in the unpainted sky to either side and behind, each on a
  // slow circle a long way out and a little above the horizon -- so a viewer
  // looking at a painting has them at the edge of the frame, and one who turns
  // round finds them. Station 3 is the first to have any and station 10 has
  // the most; 5 and 6 are a room and a night, and 7 has none because nothing
  // moves there.
  //
  // What they are not is the projection show's crows, which fly out of the
  // canvas at you. The crows painted into the last field are paint and stay
  // where he put them; these have been somewhere else the whole time. And at
  // the end, after the nothing, they are the ones that come: DESIGN 7's "then
  // the crows again", in from behind and over the bare canvas.
  const crows = (() => {
    // the larger birds: at the angle the painting gives them, the thirteen of the
    // thirty-two that are three centimetres or more across read as birds, and
    // the rest are specks at the edge of the frame. They stay in the painting.
    const kind = (CROWS?.birds || []).filter(b => b.strokes.length >= 2 && b.cm[0] >= 3);
    const list = [];
    const AFTER = STS.find(s => s.crows?.after);
    const afterAxis = AFTER ? AXIS.find(a => a.kind === 'station' && a.i === AFTER._i) : null;
    const NOTHING = AFTER ? num('nothing', AFTER.pacing?.nothing ?? 24) : 0;
    let afterT = num('afterat', 0), flying = 0;
    if (!kind.length || flatMode) return { update() {}, state: () => ({ birds: 0 }) };
    const D2R = Math.PI / 180;
    // the painting's own scale for them: a canvas is hung fifty degrees across,
    // so a centimetre of a 103 cm canvas is 50/103 of a degree, and a bird at
    // the edge of a station is the angle it has in the painting. At the end it
    // is nearly twice that, because there it is the only thing to look at.
    const DEG_PER_CM = 50 / 103;
    const lin = c => Math.pow(c / 255, 2.2);
    const geometry = b => {
      const pos = [], col = [], idx = [];
      for (const s of b.strokes) {
        const p = s.p, w = Math.max(s.w, 0.3), N = 12;
        const c = [lin(s.rgb[0]), lin(s.rgb[1]), lin(s.rgb[2])];
        const base = pos.length / 3;
        for (let k = 0; k <= N; k++) {
          const t = k / N, m = 1 - t;
          const x = m * m * p[0][0] + 2 * m * t * p[1][0] + t * t * p[2][0];
          const y = m * m * p[0][1] + 2 * m * t * p[1][1] + t * t * p[2][1];
          const dx = 2 * m * (p[1][0] - p[0][0]) + 2 * t * (p[2][0] - p[1][0]);
          const dy = 2 * m * (p[1][1] - p[0][1]) + 2 * t * (p[2][1] - p[1][1]);
          const l = Math.hypot(dx, dy) || 1, hw = 0.5 * w * (0.4 + 0.6 * Math.sin(Math.PI * t));
          pos.push(x - dy / l * hw, y + dx / l * hw, 0, x + dy / l * hw, y - dx / l * hw, 0);
          col.push(...c, ...c);
          if (k < N) { const a = base + 2 * k; idx.push(a, a + 1, a + 2, a + 1, a + 3, a + 2); }
        }
      }
      const g = new THREE.BufferGeometry();
      g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
      g.setAttribute('aCol', new THREE.Float32BufferAttribute(col, 3));
      g.setIndex(idx);
      return g;
    };
    // black paint with the little light a black oil catches, and dark with its
    // station like everything else there
    const material = sn => new THREE.ShaderMaterial({
      uniforms: { uDim: sn._dim },
      vertexShader: `attribute vec3 aCol; varying vec3 vC;
        void main() { vC = aCol; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }`,
      fragmentShader: COMMON + `uniform float uDim; varying vec3 vC;
        void main() { gl_FragColor = vec4(linearToSrgb((vC + vec3(0.010, 0.011, 0.014)) * uDim), 1.0); }`,
      side: THREE.DoubleSide });
    // the unpainted sky of a station, as yaw intervals in degrees: every canvas
