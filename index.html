    // that stands in the air takes its own width out of it and twelve degrees
    // more, so a circling bird cannot drift onto one. A canvas laid on the
    // ground is at your feet and takes nothing out of the sky.
    const freeSky = sn => {
      const iv = sn.canvases.filter(c => c.treatment !== 'ground').map(c => {
        const h = (c.hfov ?? 50) / 2 + 12, y = c.yaw || 0;
        return [y - h, y + h];
      }).sort((p, q) => p[0] - q[0]);
      const m = [];
      for (const [a, b] of iv) {
        if (m.length && a <= m[m.length - 1][1]) m[m.length - 1][1] = Math.max(m[m.length - 1][1], b);
        else m.push([a, b]);
      }
      if (!m.length) return [[-180, 180]];
      const out = [];
      for (let k = 0; k < m.length; k++) {
        const a = m[k][1], b = k + 1 < m.length ? m[k + 1][0] : m[0][0] + 360;
        if (b - a > 20) out.push([a, b]);
      }
      return out;
    };
    const dirOf = yaw => [-Math.sin(yaw * D2R), -Math.cos(yaw * D2R)];   // a canvas's own convention
    let seed = 1890;
    const rnd = () => ((seed = (seed * 1664525 + 1013904223) >>> 0) / 4294967296);
    for (const sn of STS) {
      const n = sn.crows?.n || 0;
      if (!n) continue;
      const mat = material(sn), after = !!sn.crows.after, gaps = freeSky(sn);
      for (let k = 0; k < n; k++) {
        const b = kind[(sn.id * 7 + k * 11) % kind.length];
        const mesh = new THREE.Mesh(geometry(b), mat);
        mesh.frustumCulled = false;
        mesh.visible = false;
        scene.add(mesh);
        let yaw, D, R, elev;
        if (after) {
          // in front, in plain view, which is the first time
          yaw = -36 + 72 * (k + 0.5) / n + (rnd() - 0.5) * 8;
          D = 55 + 40 * rnd(); R = 14 + 16 * rnd(); elev = 7 + 9 * rnd();
        } else {
          // at the edges of the paint first, one gap after another, then the
          // middle of the widest, which is behind
          const g = gaps[k % gaps.length], wide = g[1] - g[0];
          D = 140 + 40 * rnd();
          // small circles, so that a bird keeps to the edge of the paint: the
          // twelve degrees of margin are already out of the gap, and a viewer
          // looking at the outermost canvas has that edge at the side of the frame
          R = Math.min(20, Math.max(8, D * Math.sin(Math.max(2, wide / 2 - 4) * D2R)));
          const swing = Math.asin(Math.min(0.9, R / D)) / D2R;
          const pick = Math.floor(k / gaps.length) % 3;
          yaw = wide < 2 * swing + 6 ? (g[0] + g[1]) / 2
              : pick === 0 ? g[0] + swing + 2 : pick === 1 ? g[1] - swing - 2 : (g[0] + g[1]) / 2;
          elev = 4 + 7 * rnd();
        }
        const [dx, dz] = dirOf(yaw);
        mesh.scale.setScalar(D * Math.tan(DEG_PER_CM * (after ? 1.8 : 1) * D2R));   // metres per centimetre
        list.push({ mesh, sn, after, yaw, cx: sn._origin.x + dx * D, cz: sn._origin.y + dz * D, R,
                    A: (sn.eye ?? 1.65) + D * Math.tan(elev * D2R),
                    w: (6 + 3 * rnd()) / R * (rnd() < 0.5 ? -1 : 1), phase: 6.283 * rnd(),
                    delay: after ? 1.4 * k : 0, tin: 9 + 3 * rnd(), bank: (rnd() - 0.5) * 0.3 });
      }
    }
    const P = new THREE.Vector3(), E = new THREE.Vector3();
    const at = (c, a) => P.set(c.cx + c.R * Math.cos(a), c.A, c.cz + c.R * Math.sin(a));
    return {
      update(dt, still) {
        // the end: how long the viewer has stood in the nothing, in their own
        // seconds, and it starts again if they leave it
        if (afterAxis && scrub >= afterAxis.lo - 1e-9) { if (!still) afterT += dt; }
        else afterT = 0;
        const T = TIME.value;
        flying = 0;
        for (const c of list) {
          let show = c.sn._dim.value > 0.004;
          if (c.after) {
            const tt = afterT - NOTHING - c.delay;
            show = show && tt >= 0;
            if (show) {
              if (tt < c.tin) {
                // in from behind and above, over the viewer's head
                const s = tt / c.tin, k = s * s * (3 - 2 * s);
                E.copy(at(c, c.phase));
                P.set(c.sn._origin.x + (c.cx - c.sn._origin.x) * 0.2, c.A + 60,
                      c.sn._origin.y + 240).lerp(E, k);
              } else at(c, c.phase + c.w * (tt - c.tin));
            }
          } else if (show) {
            at(c, c.phase + c.w * T);
            P.y += 1.2 * Math.sin(0.31 * T + c.phase);
          }
          c.mesh.visible = show;
          if (!show) continue;
          flying++;
          c.mesh.position.copy(P);
          // his mark, facing whoever is looking at it, tipped a little
          c.mesh.quaternion.copy(cam.quaternion);
          c.mesh.rotateZ(c.bank * Math.sin(0.23 * T + c.phase));
        }
      },
      state: () => ({ birds: list.length, flying, kinds: kind.length,
                      after: afterAxis ? +afterT.toFixed(2) : null, nothing: NOTHING,
                      arrived: list.filter(c => c.after && c.mesh.visible).length,
                      at: list.filter(c => !c.after).map(c => ({ station: c.sn.id, yaw: +c.yaw.toFixed(1) })) }),
    };
  })();

  // ------------------------------------------------------------ the loop --
  const still = has('still');
  const dbgEl = document.getElementById('debug');
  if (has('debug')) dbgEl.style.display = 'block';
  // Two numbers, because they measure different things and only one of them is
  // the frame. ft is how long the callback takes to submit the frame, which
  // WebGL returns from before the GPU has drawn any of it. fps is the interval
  // between callbacks, which with no display attached is unthrottled and is
  // therefore actual throughput.
  let last = performance.now(), ft = 16, frames = 0;
  let winStart = last, winFrames = 0, fps = 0;

  // The third number, and the only one that says how much room is left. rAF is
  // pinned to the display's 60 Hz even with no display attached, so "60 fps" is
  // the cap being met, not the cost of meeting it. A timer query asks the GPU
  // how long the draw actually took.
  const gl = renderer.getContext();
  const timerExt = gl.getExtension('EXT_disjoint_timer_query_webgl2');
  const inflight = [];
  let gpuMs = 0, timing = false;
  const gpuBegin = () => {
    if (!timerExt || timing || inflight.length > 4) return null;
    const q = gl.createQuery();
    gl.beginQuery(timerExt.TIME_ELAPSED_EXT, q);
    timing = true;
    return q;
  };
  const gpuEnd = q => {
    if (q) { gl.endQuery(timerExt.TIME_ELAPSED_EXT); timing = false; inflight.push(q); }
    while (inflight.length) {
      const f = inflight[0];
      if (!gl.getQueryParameter(f, gl.QUERY_RESULT_AVAILABLE)) break;
      const bad = gl.getParameter(timerExt.GPU_DISJOINT_EXT);
      const ns = gl.getQueryParameter(f, gl.QUERY_RESULT);
      if (!bad) gpuMs = gpuMs ? gpuMs + (ns / 1e6 - gpuMs) * 0.12 : ns / 1e6;
      gl.deleteQuery(f);
      inflight.shift();
    }
  };
  const lie = { v: body.lying };
  // ?trace: tau against the clock, every frame, for tools/beat.py -- the
  // refusal is a length of time and a probe at the end of a run cannot see one
  const TRACE = has('trace') ? [] : null;

  function frame(now) {
    // clamped delta, so a loop stalled by a hidden tab never teleports the body
    const dt = Math.min(0.05, Math.max(0, (now - last) / 1000));
    last = now;
    if (playing && !still) advance(dt);
    if (!still) tickGates(dt);
    if (TRACE && TRACE.length < 30000) TRACE.push([+(now / 1000).toFixed(3), +scrub.toFixed(6)]);
    // the one clock. ?still does not advance it, which is what makes a still a
    // still rather than a frame of an animation that happens to be repeatable.
    if (!still) TIME.value += dt;

    if (!flatMode) {
      const fwd = (keys.has('KeyW') || keys.has('ArrowUp') ? 1 : 0) - (keys.has('KeyS') || keys.has('ArrowDown') ? 1 : 0);
      const str = (keys.has('KeyD') ? 1 : 0) - (keys.has('KeyA') ? 1 : 0);
      if (keys.has('ArrowLeft')) { setScrub(scrub - dt * 0.18); playing = false; }
      if (keys.has('ArrowRight')) { pushScrub(scrub + dt * 0.18, 'key'); playing = false; }
      const sp = 1.45 * (keys.has('ShiftLeft') ? 3.2 : 1);
      const sy = Math.sin(body.yaw), cy = Math.cos(body.yaw);
      const moving = !still && (fwd || str);
      if (moving) {
        const m = 1 / Math.hypot(fwd || 0, str || 0);
        // Past the edge the step outward gives out, and at `ease` metres it is
        // gone. The return below pushes at 1.8 m/s and Shift walks at 4.64, so
        // until M8 a runner simply outran it -- through a room's walls, out of
        // any station, as far as they cared to hold the key. Now nothing gets
        // further out than `ease`, and walking settles less than half of it out.
        const give = (v, c, half, d) => {
          const o = Math.abs(v - c) + Math.abs(d) - half;   // where this step would end
          return o > 0 && d * (v - c) > 0 ? d * Math.max(0, 1 - o / EASE) : d;
        };
        body.x += give(body.x, CX, HX, (-sy * fwd + cy * str) * sp * dt * m);
        body.z += give(body.z, CZ, HZ, (-cy * fwd - sy * str) * sp * dt * m);
        body.phase += dt * sp * 2.6;
      }
      // the eased return. It builds over `ease` metres and then holds at a
      // little more than a walking pace, so a viewer who pushes feels the
      // ground take them back rather than a wall arrive.
      let pushX = 0, pushZ = 0;
      if (!still) {
        // about the volume's own centre, which M5 added and this line did not
        // read: edgeDist measured against the centre and the return pushed
        // against the origin, so a station whose volume is offset -- the
        // Bedroom, the corridor -- measured one boundary and enforced another.
        // At station 2 that is a wall sixteen metres from the standpoint and a
        // corridor thirty-one metres long, and the far half of the hang was
        // outside a boundary the instrument said it was inside.
        const back = (v, c, half) => {
          const o = Math.abs(v - c) - half;
          return o <= 0 ? 0 : -Math.sign(v - c) * Math.min(1, o / EASE) * RETURN * dt;
        };
        pushX = back(body.x, CX, HX);
        pushZ = back(body.z, CZ, HZ);
        body.x += pushX;
        body.z += pushZ;
      }
      // DESIGN 15's open question, instrumented. Over a fifth of the time spent
      // within half a metre of the edge and the volume is wrong -- or the idea
      // is, and we would rather learn that here than at M6.
      if (!still) {
        const e = edgeDist(body.x, body.z);
        walk.t += dt;
        if (e < NEAR_EDGE) walk.near += dt;
        if (e < 0) walk.out += dt;
        walk.far = Math.max(walk.far, -Math.min(e, 0));
        if (moving) {
          walk.moving += dt;
          if (e < NEAR_EDGE) walk.movingNear += dt;
          // pressing: the ground is pushing back and the input is pushing out.
          const m = 1 / Math.hypot(fwd || 0, str || 0);
          const ix = (-sy * fwd + cy * str) * m, iz = (-cy * fwd - sy * str) * m;
          if ((pushX || pushZ) && ix * pushX + iz * pushZ < 0) walk.press += dt;
        }
      }

      lie.v += (body.lying - lie.v) * Math.min(1, dt * 4.5);
      // the head moves on each step; it is the only thing saying you have a body
      const bob = still ? 0 : Math.sin(body.phase * 2) * 0.019 + Math.sin(body.phase) * 0.006;
      // body.x and body.z are where you are *inside* a station; the base is
      // which station, and on the road it is between two. Adding them here is
      // the whole transit: tau moves the base, the walk moves the body, neither
      // knows about the other and the sum is continuous in both.
      baseAt(scrub, carry);
      const wx = carry.x + body.x, wz = carry.y + body.z;
      // and how far the nearest station is, which is what says whether the
      // world is lit. Inside a volume this is a few metres and DIM is 1.
      // Per station, not for the world as a whole: standing in Saint-Remy the
      // Harvest is six hundred metres behind and must be as dark as it was in
      // the middle of the road, whatever is lit here.
      let near = Infinity;
      for (const sn of STS) {
        const d = Math.hypot(wx - sn._origin.x, wz - sn._origin.y);
        near = Math.min(near, d);
        const k = clamp01((d - DIM_NEAR) / (DIM_FAR - DIM_NEAR));
        sn._dim.value = 1 - k * k * (3 - 2 * k);
      }
      const dt2 = clamp01((near - DIM_NEAR) / (DIM_FAR - DIM_NEAR));
      DIM.value = 1 - dt2 * dt2 * (3 - 2 * dt2);
      // M5, and the one thing at station 5 the viewer does with their feet.
      // Three canvases of one room, each with an `at` saying how far into the
      // room it *is* the room, and walking forward hands the paint from one to
      // the next. A plain tent between the two nearest keys, so the weights sum
      // to exactly one and the room is never half-painted -- and the handover
      // is per stroke rather than by transparency, so what the viewer sees is
      // his second version of a mark replacing his first, not two rooms
      // superimposed. Backwards along -z is the axis because that is the
      // direction the window looks, which for a built canvas is the vanishing
      // point and therefore the direction he was facing.
      for (const keys of PRESENCE) {
        for (const c of keys.cv) c.presence.value = 0;
        // A canvas that has not been painted yet cannot be walked into. Two of
        // station 5's three Bedrooms are September 1889 and the first is
        // October 1888, so until tau has reached them the room stays the room
        // he was living in however far you walk -- and once tau passes, the
        // same walk reaches the asylum. The chronology is not decoration here;
        // it is the gate.
        const use = keys.cv.filter(c => c.uni.uScrub.value >= 0.999);
        if (use.length < 2) { (use[0] ?? keys.cv[0]).presence.value = 1; continue; }
        const fwd = -(wz - keys.origin);
        let j = 0;
        while (j < use.length - 2 && fwd > use[j + 1].at) j++;
        const a = use[j], b = use[j + 1];
        const u = clamp01((fwd - a.at) / Math.max(b.at - a.at, 1e-6));
        a.presence.value = 1 - u; b.presence.value = u;
      }
      const ground = terrainJS(wx, wz);
      const eye = EYE * (1 - lie.v) + LIE * lie.v;
      cam.position.set(wx, ground + eye + bob * (1 - lie.v), wz);
      floor.position.set(wx, 0, wz);
      dome.position.set(wx, 0, wz);
      cam.rotation.set(0, 0, 0);
      cam.rotateY(body.yaw);
      cam.rotateX(body.pitch + lie.v * 1.15);
      cam.rotateZ(still ? 0 : Math.sin(body.phase) * 0.004 * (1 - lie.v));
    }
    eyeVec.copy(cam.position);
    // per frame, not per scrub: the frustum moves when the body does
    cam.updateMatrixWorld();
    scene.updateMatrixWorld();
    updateChunks();
    brush.update(dt);
    crows.update(dt, still);
    const at = canvasAt(scrub);
    if (at !== capShown && !STS[0].lone && fetched[at]) showCaption(at);
    if (at !== letAt && !STS[0].lone && fetched[at]) letterAt(at);

    const gq = gpuBegin();
    renderer.render(scene, cam);
    gpuEnd(gq);
    ft += ((performance.now() - now) - ft) * 0.1;
    frames++;
    if (++winFrames >= 30) {
      fps = winFrames * 1000 / Math.max(1e-3, now - winStart);
      winStart = now; winFrames = 0;
    }
    if (has('debug') && (frames & 7) === 0) {
      const info = renderer.info.render;
      // the canvas tau is on, not the first one: two stations of three canvases
      // each, and a readout that always spoke for the Harvest would be lying
      // about five of them.
      const cvNow = fetched[at] || first;
      const b = cvNow.blob;
      const edge = walk.t > 0 ? walk.near / walk.t : 0;
      const ax = axisAt(scrub);
      dbgEl.textContent =
        `tau      ${scrub.toFixed(4)}   ${specs[at].title || ''}\n` +
        `station  ${state.station}\n` +
        `when     ${dateText(dateAt(scrub))}   ` +
        `${ax.a.kind === 'transit'
           ? `on the road, ${(carry.y - STS[ax.a.a]._origin.y).toFixed(0)} of ${APART} m`
           : `at the standpoint`}\n` +
        `canvases ${arrived} of ${specs.length}  ${state.streaming || 'loading'}\n` +
        `strokes  ${total}  shown ${countShown()}  (near ${shownNear}  mid ${shownMid})\n` +
        `chunks   ${chunksDrawn} of ${chunkTotal} drawn\n` +
        `quality  ${tier}  seg ${TIERS[tier].seg}x${TIERS[tier].col}  dpr ${renderer.getPixelRatio()}\n` +
        `draws    ${info.calls}\n` +
        `tris     ${(info.triangles / 1000).toFixed(1)} k\n` +
        `submit   ${ft.toFixed(2)} ms cpu\n` +
        `gpu      ${gpuMs ? gpuMs.toFixed(2) + ' ms' : 'no timer query'}\n` +
        `frame    ${fps ? (1000 / fps).toFixed(2) + ' ms   ' + fps.toFixed(0) + ' fps' : '...'}\n` +
        `cam      ${body.x.toFixed(2)},${cam.position.y.toFixed(2)},${body.z.toFixed(2)}\n` +
        `volume   ${HX}x${HZ} m  ease ${EASE}   edge ${(edge * 100).toFixed(1)}%` +
        ` of ${walk.t.toFixed(0)}s  (over ${(EDGE_LIMIT * 100).toFixed(0)}% and it is wrong)\n` +
        `place    ${cvNow.mode}${cvNow.mode === cvNow.measured ? '' :
                    `  (measured ${cvNow.measured}, the station overrides it)`}` +
        `   horizon ${b.horizon.toFixed(3)}` +
        `  ${b.horizonRatio.toFixed(1)}x the upright cut` +
        `${b.horizonRatio < 5 ? ' -- not a horizon' : ''}   gamma ${b.gamma.toFixed(2)} built,` +
        ` ${b.gammaMeasured >= 0 ? '+' : ''}${b.gammaMeasured.toFixed(2)} measured\n` +
        `curl     ${b.curlTurning} strokes turn   arc ${b.curlArc.toFixed(2)} of its own length,` +
        ` tangent ${b.curlLine.toFixed(2)}  (${b.curlRatio.toFixed(2)}x, bar was ` +
        `${b.curlBar.toFixed(1)}x; ${b.curlMirror.toFixed(2)}x the mirrored arc)` +
        `   gain ${cvNow.uni.uCurlGain.value.toFixed(2)}\n` +
        (b.shellPoints ? `shell    ${b.shellPoints} authored depths, ` +
          `${b.shellNear.toFixed(1)} to ${b.shellFar.toFixed(0)} m   ` +
          `tears at ${b.shellHalf.toFixed(2)} m\n` : '') +
        `blob     ${b.slug}  v${b.version}\n` +
        `under    ${state.under}\n` +
        `colour   ${b.profile || (b.colourFlags ? '?' : 'no ICC in the scan')}\n` +
        `bandpass ${b.bandpass ? b.bandpass.toFixed(2) : 'n/a'}\n` +
        `order    ${b.orderMethod ? 'crossings' : 'habits only'}  ` +
        `${b.orderEdges} edges  held out ` +
        `${(b.orderSolver * 100).toFixed(1)}% vs ${(b.orderHeur * 100).toFixed(1)}%` +
        ` (${(b.orderMargin * 100 >= 0 ? '+' : '')}${(b.orderMargin * 100).toFixed(1)})\n` +
        `acts     ${actList.map(a => a.name).join(' ') || 'none'}` +
        `${held > 0 ? '   (holding ' + held.toFixed(1) + ' s)' : playing ? '   (painting)' : ''}\n` +
        `src      ${b.srcSha.slice(0, 12)}\n` +
        `params   ${b.paramSha.slice(0, 12)}`;
    }
    requestAnimationFrame(frame);
  }

  const countShown = () => shownNear + shownMid;

  // ------------------------------------------------------------ debug API --
  window.vg = {
    get state() {
      const b = first.blob;
      return { tau: scrub, cam: [body.x, cam.position.y, body.z, body.yaw, body.pitch],
               strokes: total, resident: canvases.reduce((a, c) => a + (c ? c.blob.count : 0), 0),
               shown: countShown(), near: shownNear, mid: shownMid,
               chunks: chunkTotal, chunksDrawn,
               submitMs: +ft.toFixed(2), gpuMs: +gpuMs.toFixed(2), fps: +fps.toFixed(1),
               frameMsMeasured: +(1000 / Math.max(fps, 1e-3)).toFixed(2),
               draws: renderer.info.render.calls,
               triangles: renderer.info.render.triangles,
               quality: tier, dpr: renderer.getPixelRatio(),
               blob: b.slug, version: b.version, src: b.srcSha,
               params: b.paramSha, heightMethod: b.heightMethod,
               profile: b.profile, colourFlags: b.colourFlags,
               bandpass: b.bandpass, under: state.under,
               orderMethod: b.orderMethod, orderEdges: b.orderEdges,
               orderMargin: b.orderMargin, orderSolver: b.orderSolver,
               orderHeur: b.orderHeur, orderBlock: b.orderBlock,
               acts: actList.map(a => ({ name: a.name, hi: a.hi, canvas: a.canvas })),
               playing, held: +held.toFixed(2),
               letter: letShown && letEl?.classList.contains('on')
                 ? { n: letShown.n, text: letShown.text, cite: citeOf(letShown) } : null,
               letters: LETTERS.map(e => ({ station: e.sn.id, n: e.L.n, canvas: specs[e.k].title,
                                            text: e.L.text })),
               audio: brush.state(),
               // M8: the refusal, the end of what plays itself, and the crows
               gates: window.vg.beats(), playEnd: +PLAY_END.toFixed(6),
               crows: crows.state(),
               trace: TRACE || undefined,
               // DESIGN 11: every quotation in the DOM as text, whatever tau is
               letterDom: [...document.querySelectorAll('#letterlist li')].map(li => li.textContent),
               station: st.lone ? null : st.id, stationTitle: st.title,
               where: axisAt(scrub).a.kind, when: dateText(dateAt(scrub)),
               readout: whenEl ? whenEl.textContent : null,
               base: [carry.x, carry.y],
               streaming: state.streaming || 'loading',
               missing: (state.missing || []).slice(),
               canvases: specs.map((s, i) => ({
                 title: s.title, blob: s.blob, yaw: s.yaw,
                 loaded: !!fetched[i], span: [+s._lo.toFixed(4), +s._hi.toFixed(4)],
                 fetchMs: fetched[i] ? fetched[i].fetchMs : null,
                 buildMs: fetched[i] ? fetched[i].buildMs : null,
                 readyAt: fetched[i] ? fetched[i].readyAt : null,
                 mode: fetched[i] ? fetched[i].mode : null,
                 measured: fetched[i] ? fetched[i].measured : null,
                 curlK: fetched[i] ? fetched[i].blob.curlK : null,
                 curlRatio: fetched[i] ? fetched[i].blob.curlRatio : null,
                 curlMirror: fetched[i] ? fetched[i].blob.curlMirror : null,
                 shellHalf: fetched[i] ? fetched[i].blob.shellHalf : null,

                 horizon: fetched[i] ? fetched[i].blob.horizon : null,
                 horizonRatio: fetched[i] ? fetched[i].blob.horizonRatio : null,
                 gammaMeasured: fetched[i] ? fetched[i].blob.gammaMeasured : null,
                 sizeRatio: fetched[i] ? fetched[i].blob.sizeRatio : null,
                 sizeDemand: fetched[i] ? fetched[i].blob.sizeDemand : null,
               })),
               volume: window.vg.volume(),
               presence: window.vg.presence(),
               rooms: canvases.filter(c => c && c.room).map(c => ({
                 title: c.spec.title,
                 wide: +(c.room.left + c.room.right).toFixed(3),
                 left: +c.room.left.toFixed(3), right: +c.room.right.toFixed(3),
                 high: +c.room.ceil.toFixed(3), deep: +c.room.depth.toFixed(3),
                 vpMeasured: [+c.blob.vpU.toFixed(4), +c.blob.vpV.toFixed(4)],
                 vpAuthored: c.spec.axis ?? null,
                 vpRatio: +c.blob.vpRoomRatio.toFixed(3),
               })) };
    },
    scrub: setScrub,
    // and the way a hand moves it, which is the way that can be refused
    push: (t, how = 'harness') => { pushScrub(+t, how); return scrub; },
    // what happened at station 7's gate, arrival by arrival -- BUILD M8's
    // exit criterion is a stranger there, and this is what they did
    beats: () => GATES.map(g => ({
      station: STS[g.i].id, tau: +g.at.toFixed(6), refuse: g.refuse, state: g.state,
      arrivals: g.log.map(e => ({ ...e, keySeconds: +e.keySeconds.toFixed(2) })) })),
    // a hand on the scrub, so the refusal can be met without a person: 'hold'
    // keeps the right arrow down, 'wheel' turns it forward four times a second,
    // 'jump' clicks the band once, at ?jumpto
    hand: (kind = 'hold', seconds = 10) => new Promise(res => {
      const t0 = performance.now();
      let last = 0;
      const step = now => {
        const el = (now - t0) / 1000;
        if (kind === 'hold') keys.add('ArrowRight');
        else if (kind === 'wheel' && el - last > 0.25) { last = el; pushScrub(scrub + 0.004, 'wheel'); }
        else if (kind === 'jump' && !last) { last = 1; pushScrub(num('jumpto', 0.9), 'band'); }
        if (el < seconds) requestAnimationFrame(step);
        else { keys.delete('ArrowRight'); res(window.vg.beats()); }
      };
      requestAnimationFrame(step);
    }),
    crows: () => crows.state(),
    // Going to a station means putting tau at the start of its making, because
    // tau is the transport: there is no other way to be somewhere in this piece.
    station: n => {
      const sn = STS.find(x => x.id === +n);
      if (!sn) {
        console.warn(`station ${n}: this build has ` +
                     (STS[0].lone ? 'one canvas and no station'
                                  : STS.map(x => x.id).join(' and ')));
        return null;
      }
      const a = AXIS.find(x => x.kind === 'station' && x.i === sn._i);
      setScrub(a.lo + 1e-6);
      body.x = 0; body.z = 0; body.yaw = 0; body.pitch = 0;
      return { id: sn.id, title: sn.title, when: sn.when, where: sn.where,
               tau: [a.lo, a.hi] };
    },
    // Stand somewhere. The walk is the only control the piece gives a viewer
    // that tau does not, and at station 5 it is the control that changes the
    // painting, so it has to be drivable from outside a pair of hands.
    at: (x, z, yaw) => {
      body.x = +x || 0; body.z = +z || 0;
      if (yaw !== undefined) body.yaw = +yaw;
      return { x: body.x, z: body.z, yaw: body.yaw };
    },
    // Which canvas the paint is made of, where there is more than one answer.
    presence: () => PRESENCE.map(g => ({
      station: g.cv[0].sn.id,
      forward: +(-(carry.y + body.z - g.origin)).toFixed(3),
      of: g.cv.map(c => ({ title: c.spec.title, at: c.at,
                           painted: +c.uni.uScrub.value.toFixed(3),
                           present: +c.presence.value.toFixed(4) })),
    })),
    // and where the road is, so the transit can be driven from the console
    // rather than only walked into.
    axis: () => AXIS.map(a => (a.kind === 'station'
      ? { kind: 'station', id: STS[a.i].id, title: STS[a.i].title,
          tau: [+a.lo.toFixed(5), +a.hi.toFixed(5)],
          date: [dateText(spanOf(STS[a.i])[0]), dateText(spanOf(STS[a.i])[1])] }
      : { kind: 'transit', from: STS[a.a].id, to: STS[a.b].id,
          tau: [+a.lo.toFixed(5), +a.hi.toFixed(5)],
          metres: APART, seconds: +a.secs.toFixed(1) })),
    // M6's exit criterion, as a number rather than as a walk: step tau from 0
    // to 1 and report where the piece is and what the date says at each step.
    // The arc holds if the date never goes backwards, every station is passed
    // through, and no step leaves the piece -- which is what the third column
    // is: the world position the body would be carried to.
    arc: (n = 400) => {
      const out = [], p = new THREE.Vector2();
      for (let k = 0; k <= n; k++) {
        const t = k / n, a = axisAt(t), sn = stationAt(t);
        baseAt(t, p);
        out.push({ tau: +t.toFixed(5), kind: a.a.kind, id: sn.id ?? null,
                   date: dateText(dateAt(t)), day: +dateAt(t).toFixed(6),
                   z: +p.y.toFixed(1),
                   seconds: +(a.a.kind === 'transit' ? a.a.secs : stationS(STS[a.a.i])).toFixed(1) });
      }
      return out;
    },
    volume: () => ({
      half: [HX, HZ], ease: EASE, shape: VOL.shape || 'slab',
      seconds: +walk.t.toFixed(1),
      nearEdge: walk.t > 0 ? +(walk.near / walk.t).toFixed(4) : 0,
      nearEdgeMoving: walk.moving > 0 ? +(walk.movingNear / walk.moving).toFixed(4) : 0,
      outside: walk.t > 0 ? +(walk.out / walk.t).toFixed(4) : 0,
      pressing: walk.t > 0 ? +(walk.press / walk.t).toFixed(4) : 0,
      furthestOut: +walk.far.toFixed(2), limit: EDGE_LIMIT,
      verdict: walk.t < 20 ? 'not enough walking yet'
               : (walk.near / walk.t) > EDGE_LIMIT ? 'the volume is wrong' : 'the volume holds',
      pressVerdict: walk.t < 20 ? 'not enough walking yet'
               : (walk.press / walk.t) > EDGE_LIMIT ? 'they are trying to leave'
               : 'they are not trying to leave',
    }),
    // Three walkers, so the instrument can be read without a person in the
    // chair. They are not the test DESIGN 15 asks for and they do not pretend
    // to be one -- a person is the test, and what a person does is the thing
    // nobody here can guess. What these are for is to say what the instrument
    // returns for three ways of moving, so that when there is a number from a
    // person it can be read against something.
    //
    //   forward   hold W and never turn. The naive worst case, and the first
    //             thing a viewer who has been told nothing actually does.
    //   wander    walk, and every few seconds pick a new heading within a
    //             third of a turn and swing onto it. An amble.
    //   look      walk a few paces, stop, turn, look, walk again.
    wander: (kind = 'forward', seconds = 60) => new Promise(res => {
      const t0 = performance.now();
      let prev = t0, aim = body.yaw, next = 0, go = true;
      Object.assign(walk, { t: 0, near: 0, moving: 0, movingNear: 0, out: 0, far: 0, press: 0 });
      const step = now => {
        const dt = Math.min(0.05, (now - prev) / 1000), el = (now - t0) / 1000;
        prev = now;
        keys.clear();
        if (kind === 'forward') {
          keys.add('KeyW');
        } else if (kind === 'wander') {
          if (el > next) { aim = body.yaw + (rnd() - 0.5) * 2.1; next = el + 2 + rnd() * 3; }
          body.yaw += Math.max(-1.6 * dt, Math.min(1.6 * dt, aim - body.yaw));
          keys.add('KeyW');
        } else {
          if (el > next) { go = !go; next = el + (go ? 1.5 + rnd() * 2.5 : 2 + rnd() * 3); }
          if (go) keys.add('KeyW'); else body.yaw += (rnd() - 0.5) * 1.4 * dt;
        }
        if (el < seconds) requestAnimationFrame(step);
        else { keys.clear(); res(window.vg.volume()); }
      };
      requestAnimationFrame(step);
    }),
    strokes: () => ({ near: shownNear, mid: shownMid, far: 0 }),
    cam: (x, y, z, yaw, pitch) => { body.x = x; body.z = z; body.yaw = yaw ?? body.yaw; body.pitch = pitch ?? body.pitch; },
    // render immediately before reading: the drawing buffer is not preserved,
    // so a toDataURL that is not preceded by a draw comes back blank
    snap: () => { renderer.render(scene, cam); return renderer.domElement.toDataURL('image/png'); },
    // the brush, from outside a pair of hands: on, off, what it is doing, and
    // what it has recorded under ?soundlog
    sound: v => brush.set(v === undefined ? !brush.on : !!v),
    audio: () => brush.state(),
    wav: () => brush.wav(),
    reload: async (path) => {
      const b = readBlob(await (await fetch(path + '?t=' + Date.now())).arrayBuffer());
      const cv = canvases[0];
      const g = bindStrokes(ribbonBase(TIERS[tier].seg, TIERS[tier].col),
                            strokeBuffers(b), 0);
      g.boundingSphere = cv.chunkList[0].mesh.near.geometry.boundingSphere;
      g.instanceCount = b.count;
      cv.chunkList[0].mesh.near.geometry.dispose();
      cv.chunkList[0].mesh.near.geometry = g;
      Object.assign(cv.blob, b);
      return b.count;
    },
  };
  // a developer's key since M0a, and one key from W and D: behind ?debug
  if (has('debug'))
    addEventListener('keydown', e => { if (e.code === 'KeyR') window.vg.reload(specs[0].blob); });

  // ?walk=forward|wander|look runs the walker for ?walksec seconds and leaves
  // the numbers in vg.state.volume, so the instrument DESIGN 15 asks for can be
  // read from a headless frame. It is not that test and does not pretend to be
  // one; see vg.wander.
  if (Q.has('walk'))
    setTimeout(() => window.vg.wander(Q.get('walk') || 'wander', num('walksec', 40)), 200);

  // ?hand=hold|wheel for ?handsec seconds from ?handat ms: the refusal met by
  // a scripted hand, read back from vg.beats() in a headless frame.
  if (Q.has('hand'))
    setTimeout(() => window.vg.hand(Q.get('hand') || 'hold', num('handsec', 10)), num('handat', 200));

  // ?at=x,z[,yaw]: stand somewhere, in the station's own metres. M5 needs it
  // because at station 5 the walk is what changes the painting, so a
  // reproducible frame has to be able to say where the body was standing --
  // exactly as ?tau says where the scrub was.
  if (Q.has('at')) {
    const t = (Q.get('at') || '').split(',').map(Number);
    if (t.length >= 2 && t.every(v => Number.isFinite(v)))
      window.vg.at(t[0], t[1], t.length > 2 ? t[2] * Math.PI / 180 : undefined);
  }

  // ?probe=N: run for N real milliseconds, then hand the state back to whoever
  // is serving this page. tools/shot.py listens for it. The alternative is
  // Chrome's virtual time budget, which fast-forwards the clock -- and the
  // clock is the thing being measured.
  if (Q.has('probe')) {
    setTimeout(() => {
      fetch('/__probe', { method: 'POST', body: JSON.stringify({
        state: window.vg.state,
        png: has('nopng') ? null : window.vg.snap(),
        wav: has('soundlog') ? window.vg.wav() : null,
      }) }).catch(() => {});
    }, num('probe', 3000));
  }

  resize();
  setScrub(scrub);
  if (STS[0].lone) {
    const b = first.blob;
    const [, , tw] = b.tile[2] ? b.tile : [0, 0, ...b.canvasPx];
    document.getElementById('capt').textContent =
      `${b.slug} — ${tw === b.canvasPx[0] ? 'the canvas'
        : (tw / b.pxPerCm).toFixed(1) + ' cm of it'}, ${b.count.toLocaleString()} strokes`;
    document.getElementById('caps').textContent = '';
    body.z = num('back', 0.40 * first.scale);
    if (Q.has('cam')) body.z = Q.get('cam').split(',').map(Number)[2];
  } else {
    showCaption(0);
  }
  document.body.dataset.ready = '1';
  requestAnimationFrame(frame);
}

main().catch(e => fail('The page stopped.', e.message, e.stack || ''));
</script>
</body>
</html>
