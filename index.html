<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>The Dream of Van Gogh</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; height: 100%; background: #04060f; overflow: hidden; color: #cfd3dc; font-family: 'Cormorant Garamond', Georgia, serif; }
  #stage { position: fixed; inset: 0; }
  #stage canvas { display: block; width: 100%; height: 100%; touch-action: none; outline: none; }
  .corner { position: fixed; left: 28px; bottom: 24px; font-size: 19px; letter-spacing: 0.02em; opacity: 0; transition: opacity 1.2s; pointer-events: none; text-shadow: 0 1px 6px rgba(0,0,0,0.6); }
  .corner.on { opacity: 0.85; }
  #caption { position: fixed; left: 28px; bottom: 24px; max-width: min(620px, 74vw); font-size: 19px; line-height: 1.45;
             opacity: 0; transition: opacity 1.4s; pointer-events: none; text-shadow: 0 1px 6px rgba(0,0,0,0.7); }
  #caption.on { opacity: 0.88; }
  #caption b { display: block; font-weight: 500; font-size: 22px; letter-spacing: 0.01em; }
  #caption i { display: block; font-size: 16px; opacity: 0.7; font-style: normal; margin-bottom: 7px; }
  #caption q { quotes: none; font-style: italic; }
  #panel { position: fixed; right: 24px; top: 22px; font-size: 15px; line-height: 1.5; white-space: pre; opacity: 0.8; background: rgba(6, 8, 18, 0.55); padding: 10px 14px; border-radius: 4px; }
  #linen { position: fixed; inset: 0; background: #6d6350; opacity: 0; pointer-events: none; }
  #debug { position: fixed; left: 12px; top: 10px; font: 12px/1.4 ui-monospace, Menlo, monospace; white-space: pre; opacity: 0.7; }
  [hidden] { display: none !important; }
  #fail { position: fixed; inset: 0; display: grid; place-items: center; background: #04060f; text-align: center; }
  #fail h1 { font-weight: 400; font-size: 28px; margin: 0 0 8px; }
  #fail p { margin: 0 0 12px; opacity: 0.8; }
  #fail code { display: block; font-size: 11px; white-space: pre-wrap; max-width: 80vw; opacity: 0.6; text-align: left; }
</style>
</head>
<body>
<div id="stage"></div>
<div id="line" class="corner">you fly where you look</div>
<div id="caption"></div>
<div id="linen"></div>
<div id="panel" hidden></div>
<div id="debug" hidden></div>
<div id="fail" hidden><div><h1 id="fail-h"></h1><p id="fail-p"></p><code id="fail-c"></code></div></div>
<script type="importmap">
{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js" } }
</script>
<script type="module" src="src/main.js"></script>
</body>
</html>
